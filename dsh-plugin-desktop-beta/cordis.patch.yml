# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop-beta
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop-beta/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop-beta/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop-beta/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop-beta/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop-beta/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop-beta/updates
    - id: workbench
      name: dsh-workbench
      config:
        enabled: true
    # The Web bundle disables the host skill provider so each agent preset owns
    # local discovery, which leaves the global skill layer empty. A skill card is
    # configured before any session exists, and with no session there is no agent
    # scope to read through either — so without this row the card's picker has no
    # installed skills to offer at all. A distinct id keeps this row independent of
    # the disabled bundle row, and a same-name skill still resolves to the nearest
    # layer, so presets keep their own entries.
    - id: desktop-installed-skills
      name: '@deepseek-ai/dsh-skill-filesystem'

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []
