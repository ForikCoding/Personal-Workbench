<!doctype html>
<!--
  workbench-pipeline-v2 —— 在 workbench-pipeline-2col.html 上按 UI / 交互审核逐条改出来的版本。
  两份文件的差别就是这份清单：

   1. 整条运行真的会推进：串行引擎一步一步走完，运行记录跟着长；运行中「运行」变成
      「停止」（见 18），不再抢走正在看的那一步；检查器不再每次重渲染都跳回顶部
   2. 模板从「结果」搬到「配置」；配置分三层：整条流水线 / 这一步 / 模板
      模型与权限从假按钮换成真下拉
   3. 流水线能改名（标题就地输入）、能删除（点两次确认）
   4. 失败的那一步在运行记录里可以直接重试，不用退回画布
   5. 浅色模式次要文字对比度修到 AA（原来 2.1:1 / 3.6:1）；字号收敛成 11/12/13/15/17/20 六档
   6. 四个弹层有焦点陷阱、关闭后焦点归还，同一时刻只有一个 aria-modal，底下那层 aria-hidden
   7. 标签栏补齐 tabpanel / aria-controls / 方向键；空流水线不再"三个都没选中却有内容"
   8. 状态不只靠颜色：节点、运行条、状态标签都有各自的形状
   9. 模板预览不再用骨架条——骨架是"加载中"的语言，这里是"这块位置是空的"
  10. 连接线上的 + 改成悬停 / 聚焦才出现，底部「添加步骤」仍然常驻
  11. 同名技能不允许重复加入（重复会让运行记录按技能反查步骤时错位）
   12. 顶部多了「场景」切换：有步骤 / 0 步流水线 / 没有流水线。后两种是没有工作流时的样子——
       第一次打开工作台的人，看到的应该是「还没有流水线」，不该是别人的五步示例
   13. 任务状态补上「待运行」：以前只说「未运行」，分不清"跑过又停了"还是"一次都没跑过"。
       待运行 = 一次都没启动过（虚线框 + 空心序号 + 脚注「还没启动过」），跑过又停的是「已停止」
   14. 步骤能就地改名：检查器 ⋯ →「重命名这一步」，节点标题变输入框，回车保存 / Esc 放弃
   15. 移除一步改成点两次确认（和删除流水线同一规矩），第二次的提示写出将被移除的名字
   16. 配置页每一行都能改：工作目录、技能、运行指令、失败处理不再是死文字——换技能这一步
       就改名，运行指令跟着换成该技能的默认值（也能自己写），失败处理的说明跟着选择变
   17. 「整条跑过没有」和「哪一步单独跑过」分成两件事说。以前两者共用一个「待运行」，
       于是同一屏上一边写「待运行」、一边写「已完成」，看的人只能猜哪个算数。现在：
         · 画布标题旁的状态是整条流水线的状态，由运行记录推导：未整体运行 / 单步跑过 /
           运行中 / 已完成 / 失败 / 已停止（「单步跑过」是新的一档）
         · 形状比颜色先说话：实心绿 = 整条跑过，描边绿 = 只单独跑过其中几步。
           状态标签、圆点、运行条、步骤脚注的「单步 #1」都是这一条规则的落点
         · 底部运行条不再写「N 步都还没启动」，改成「整条还没跑过 · 第 N 步单独跑过 ·
           点「运行」会从第 N 步开始」——把后果说出来，不是只说状态
         · 一句话是几步跑过就报几步：第 1、2 步单独跑过。而且「运行」的起点由引擎算
           （resumeFrom：第一个没完成的步骤），运行条照抄它，不自己猜：
           第 2 步跑过而第 1 步没跑 → 「从第 1 步开始，跑过的那一步会重跑」；
           前两步跑过 → 「从第 3 步接着跑」；三步都单独跑过 → 「会从头再跑一遍」
         · 场景里加了「单步跑过」（三步里只单独跑过中间那一步）：整条没跑、可其中一步
           已完成的那个状态，得有地方看
   18. 能停下来了。以前只有「运行」，按下去就只能等：整条跑的时候「运行」是灰的，
       底部运行条上那个「停止」又只在整条跑时才出现，单独跑一步根本没有停的地方。
       现在停止是「运行」跑起来之后的那一态，谁启动的谁停：
         · 整条在跑 → 右上角的「运行」变成「停止」；单张卡片面同理
         · 某一步单独在跑 → 那一步的「单独运行」变成「停止」，只停这一步，不碰整条
         · 一次运行只有一个停止入口：整条在跑时，那一步的按钮只说明「停止在右上角」
         · 按钮不搬家：同一个盒子、同一段字宽（运行 / 停止都是两个字），只换图标
           （三角 → 方块）和描边色。填成实心红会被读成「出错了」，所以只描一圈
         · 按下到真的停下来之间是「正在停止」：按钮变灰按不下去，运行条说明在收什么
         · 落状态时三档分清：跑完的留着「完成」，被打断的是「已停止」（不是「排队中」，
           它不会再自己开始了），还没轮到的退回「待运行」；运行条写清停在第几步、
           点「运行」从第几步接着跑（起点同样出自 resumeFrom）
         · 底部运行条不再放第二个停止：它只说「跑到哪了」
   19. 跑过的步骤可以重跑，而且跑哪一段由人说。以前「运行」只有一个意思：从第一个
       没跑完的步骤接着跑（resumeFrom）——一跑完，那一步就再也点不动了：既不能把整条
       再来一遍，也不能"改了第 2 步的指令，从第 2 步起重跑后面三步"。
       现在范围是按钮自己说出来的，一共三个入口、一个来源：
         · 主按钮上的字由行状态推出：一次都没跑 →「运行」；有跑过的也有没跑的 →
           「接着跑」；全跑完了 →「重跑」。三个词就是三种范围，不新造第四个开关
         · 右半边那道缝后面是范围菜单，每行两句话、顺序统一（范围 · 代价）：
           「接着跑 · 第 4–5 步 · 都还没跑过」「从头重跑 · 第 1–5 步 · 换新 3 份产物」
           「从第 2 步起重跑 · 第 2–5 步 · 换新 2 份产物」（只在选中步落在起点之前时出现，
           否则它和「接着跑」是同一件事）
         · 起点只能落在"前面都跑完了"的步骤上：从半路起跑会让整条变成"完成"却缺前半段，
           那个状态没有说法，所以这一个入口在两个地方都按不下去
         · 一步自己的菜单里有「从这一步起重跑」，检查器那个按钮在跑过之后改口叫
           「重跑这一步」：同一个位置、同一件事，但"再跑一遍"和"先跑一下看看"是两种
           心情，字要说对
         · 重跑不是无代价的，代价也不是不可逆的：旧产物在运行记录里。这句话写在菜单
           底下，比弹一个确认框省事，也比不写诚实
         · 运行记录里，从后半段起的那种运行记着 from（「从第 3 步起重跑 · 共 5 步」），
           没轮到的步骤留着它们的编号 kept——否则第 5 次和第 4 次看起来一模一样
         · 跑完之后又重跑了后半段：整条仍然是「完成」，但运行条要说各步不再来自同一次
           （「第 1 步还停在第 5 次，其余是第 6 次」），不能让一个「完成」盖住它
         · 运行中右半边收起来：那一次运行只有一个出口（停止）
         · 场景里加了「全部完成」：跑完之后四个按钮各叫什么，以前没有地方能看
-->

<style>
/* ==========================================================================
   工作台原型 · 两栏版
   --------------------------------------------------------------------------
   与原版（workbench-pipeline.html）的差别只有一件事：宽度按 DSH Desktop
   主面板的真实可用宽度来设计，不再假设一个 1348px 的壳。

   插件占的就是主面板那一列，整块、无内部侧栏；DSH 自己的左侧栏在插件外面，
   不属于这个插件。所以下面这个原型框 = 面板本身，宽度可切。

   面板宽度取自仓库代码（窗口宽 - 侧栏 - 右侧面板）：
     大窗口（最大化）        → 约 1280
     窗口默认 1280x840      → 侧栏 280 → 1000   （settings-bridge.ts:158）
     窗口最小 900x640       → 侧栏 56  → 844    （columns.ts:13/19/23）
     TaskManagerPage 断点   → 760               （其 module.css:1439）
     右侧面板打开           → 424（CENTER_MIN 400 托底）

   因此：
     - 常驻三栏取消。任务库变弹出选择器。
     - 画布 + 检查器并排需 >=820；更窄时检查器滑动覆盖。
     - 断点用容器查询（@container），因为面板宽度 != 视口宽度。
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

/* 内联 svg 的兜底尺寸：任何一处忘了单独指定的图标都不会撑成一块黑板。
   具体规则（.btn svg / .iconBtn svg …）单类选择器优先级更高，照常覆盖。 */
svg { flex: none; width: 14px; height: 14px; }

:root {
  --f-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  --f-mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
}

/* ---------------------------------------------------------------- 主题令牌 */
body[data-theme="light"] {
  --base: #fff;
  --pane: #fff;
  --rail: rgb(249, 250, 251);
  --card-bg: #fff;
  --recess: rgb(249, 250, 251);
  --hover: rgba(38, 49, 72, .06);
  --hover-strong: rgba(38, 49, 72, .09);
  --ink: rgb(15, 17, 21);
  --ink2: rgb(97, 102, 107);
  --ink3: rgb(92, 97, 103);
  --ink4: rgb(111, 116, 122);
  --hairline: rgba(0, 0, 0, .1);
  --divider: rgba(0, 0, 0, .08);
  --accent: rgb(47, 98, 214);
  --accent-soft: rgba(65, 118, 230, .16);
  --accent-wash: rgba(65, 118, 230, .07);
  --success: rgb(34, 197, 94);
  --warn: rgb(245, 158, 11);
  --danger: rgb(236, 19, 19);
  --danger-wash: rgba(236, 19, 19, .06);
  --idle: rgb(212, 212, 212);
  --primary-bg: rgb(15, 17, 21);
  --primary-ink: #fff;
  --shadow-menu: 0 12px 32px rgba(0, 0, 0, .14), 0 2px 8px rgba(0, 0, 0, .06);
  --shadow-node: 0 1px 2px rgba(0, 0, 0, .04);
  --scrim: rgba(15, 17, 21, .24);
  --scroll: rgb(220, 220, 220);
}
body[data-theme="dark"] {
  --base: rgb(21, 21, 23);
  --pane: rgb(27, 27, 28);
  --rail: rgb(27, 27, 28);
  --card-bg: rgb(35, 35, 36);
  --recess: rgb(30, 30, 32);
  --hover: rgba(255, 255, 255, .08);
  --hover-strong: rgba(255, 255, 255, .12);
  --ink: rgb(249, 250, 251);
  --ink2: rgb(207, 211, 214);
  --ink3: rgb(173, 178, 184);
  --ink4: rgb(139, 144, 152);
  --hairline: rgba(255, 255, 255, .12);
  --divider: rgba(255, 255, 255, .08);
  --accent: rgb(122, 170, 255);
  --accent-soft: rgba(122, 170, 255, .2);
  --accent-wash: rgba(122, 170, 255, .1);
  --success: rgb(34, 197, 94);
  --warn: rgb(245, 158, 11);
  --danger: rgb(242, 90, 90);
  --danger-wash: rgba(242, 90, 90, .1);
  --idle: rgb(84, 85, 87);
  --primary-bg: rgb(249, 250, 251);
  --primary-ink: rgb(21, 21, 23);
  --shadow-menu: 0 12px 32px rgba(0, 0, 0, .52), 0 2px 8px rgba(0, 0, 0, .32);
  --shadow-node: 0 1px 2px rgba(0, 0, 0, .28);
  --scrim: rgba(0, 0, 0, .48);
  --scroll: rgb(67, 69, 74);
}

/* ---------------------------------------------------------------- 原型外壳 */
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 18px;
  background: #eceef1;
  font-family: var(--f-sans);
  color: rgb(15, 17, 21);
  -webkit-font-smoothing: antialiased;
}
body[data-theme="dark"] { background: #101012; color: rgb(249, 250, 251); }

.protoBar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 6px 5px 14px;
  border-radius: 999px;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
  font-size: 12px;
  white-space: nowrap;
}
body[data-theme="dark"] .protoBar { background: rgb(35, 35, 36); box-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
.pbTitle { font-weight: 500; color: rgb(97, 102, 107); }
body[data-theme="dark"] .pbTitle { color: rgb(173, 178, 184); }
.pbSeg { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: rgba(0, 0, 0, .06); }
body[data-theme="dark"] .pbSeg { background: rgba(255, 255, 255, .08); }
.pbSeg button {
  border: 0;
  padding: 4px 11px;
  border-radius: 999px;
  background: transparent;
  color: rgb(97, 102, 107);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: background .12s, color .12s;
}
.pbSeg button:hover { color: rgb(15, 17, 21); }
body[data-theme="dark"] .pbSeg button { color: rgb(173, 178, 184); }
body[data-theme="dark"] .pbSeg button:hover { color: rgb(249, 250, 251); }
.pbSeg button[aria-pressed="true"] {
  background: #fff;
  color: rgb(15, 17, 21);
  font-weight: 500;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
}
body[data-theme="dark"] .pbSeg button[aria-pressed="true"] { background: rgb(60, 61, 63); color: rgb(249, 250, 251); box-shadow: none; }

/* ------------------------------------------------------------------ 应用帧 */
/* 原型框 = 面板本身。DSH 左侧栏（新会话 / 插件 / 工作台 / 工作区）在插件外面，
   不属于这个插件，所以这里不画，宽度就是切换器标的那个数。 */
.app {
  flex: none;
  display: flex;
  width: var(--panel-w);
  height: min(800px, calc(100vh - 92px));
  border-radius: 10px;
  overflow: hidden;
  background: var(--base);
  box-shadow: 0 18px 48px rgba(0, 0, 0, .18), 0 2px 8px rgba(0, 0, 0, .08);
  transition: width .22s cubic-bezier(.4, 0, .2, 1);
}
body[data-theme="dark"] .app { box-shadow: 0 18px 48px rgba(0, 0, 0, .6), 0 0 0 0.5px rgba(255, 255, 255, .1); }

/* -------------------------------------------------------------------- 面板 */
.panel {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: var(--base);
  color: var(--ink);
  font-size: 13px;
  /* 断点跟着面板走，不跟视口走 */
  container-type: inline-size;
  container-name: panel;
}

.panelHead {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 58px;
  padding: 0 18px;
  border-bottom: 0.5px solid var(--hairline);
}
.panelHead h1 {
  margin: 0;
  font-size: 20px;
  line-height: 28px;
  font-weight: 500;
  letter-spacing: -.01em;
  white-space: nowrap;
}
.headSpacer { flex: 1; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
}
.btn svg { width: 14px; height: 14px; flex: none; }
.btn:hover { background: var(--hover); }
.btn.ghost { border: 0.5px solid var(--hairline); }
.btn.ghost:hover { background: var(--hover-strong); }
.btn.primary { background: var(--primary-bg); color: var(--primary-ink); font-weight: 500; }
.btn.primary:hover { opacity: .86; }
/* 禁用态要看得出来。审核弹框靠它表达「先写要求」这件事。 */
.btn:disabled { opacity: .38; cursor: default; }
.btn:disabled:hover { background: transparent; opacity: .38; }
.btn.ghost:disabled:hover { background: transparent; }
.btn.primary:disabled:hover { opacity: .38; }

/* ----------------------------------------------------------------- 停止 */
/* 停止不是第三个按钮，是「运行」跑起来之后的那一态：同一个盒子、同一段字宽（运行 /
   停止都是两个字），只换图标和描边——停的时候手不用重新找。
   描边而不填色：运行中是正常状态，填成实心红会被读成「出错了」。 */
.btn.stop,
.runOne.stop {
  border: 0.5px solid color-mix(in srgb, var(--danger) 42%, var(--hairline));
  color: var(--danger);
  font-weight: 500;
}
.btn.stop:hover,
.runOne.stop:hover {
  background: color-mix(in srgb, var(--danger) 8%, transparent);
  border-color: color-mix(in srgb, var(--danger) 62%, var(--hairline));
}
.btn.stop:active,
.runOne.stop:active { background: color-mix(in srgb, var(--danger) 14%, transparent); }
/* 停止中：从按下去到真的停下来之间那一下。按钮还在原地，只是不再可点 */
.btn.stop:disabled,
.runOne.stop:disabled { opacity: .55; cursor: default; }
.btn.stop:disabled:hover,
.runOne.stop:disabled:hover { background: transparent; opacity: .55; }
/* 同一个按钮两个图标：换状态只换图标，不换宽度 */
.glyphStop { display: none; }
[data-stop="1"] .glyphPlay { display: none; }
[data-stop="1"] .glyphStop { display: block; }

.panelBody { flex: 1; min-height: 0; display: flex; }
/* 只剩一个视图了，不再需要切换用的 display 开关 */
.pipelineView { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* -------------------------------------------------------------- 步骤轨道 + 结果 */
/* 执行时看的是产出。步骤是导航，结果是主体，所以这里反过来：
   轨道固定窄，结果吃掉剩余全部宽度。 */
.panes { position: relative; flex: 1; min-height: 0; display: flex; }

.canvas {
  flex: none;
  width: 280px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  border-right: 0.5px solid var(--divider);
}

.canvasHead {
  flex: none;
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 12px 14px 10px;
  border-bottom: 0.5px solid var(--divider);
}
.canvasTitleRow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.canvasTitleBtn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.canvasTitleBtn svg { width: 13px; height: 13px; flex: none; color: var(--ink3); }
.canvasTitleBtn:hover svg { color: var(--ink); }
/* 还没有流水线时，标题只是栏名，不是一个能点出菜单的入口 */
#canvasTitlePlain { cursor: default; }
.chipState {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 8px;
  border-radius: 10px;
  background: var(--hover);
  color: var(--ink2);
  font-size: 12px;
  white-space: nowrap;
}
.chipState[data-s="running"] { background: var(--accent-wash); color: var(--accent); }
.chipState[data-s="done"] { background: color-mix(in srgb, var(--success) 12%, transparent); color: color-mix(in srgb, var(--success) 82%, var(--ink)); }
.chipState[data-s="failed"] { background: var(--danger-wash); color: var(--danger); }
.chipState[data-s="idle"], .chipState[data-s="stopped"] { background: var(--hover); color: var(--ink2); }
/* 单步跑过：这条流水线跑过，但只是单独跑了其中一步——整条还没跑。
   不新增颜色，用「实心 / 描边」这层结构分开：实心绿 = 整条跑完，描边绿 = 只跑了一步。
   形状是比颜色更可靠的线索，色弱的人也能一眼分清。 */
.chipState[data-s="solo"] {
  background: transparent;
  box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--success) 55%, transparent);
  color: color-mix(in srgb, var(--success) 60%, var(--ink));
}
/* 这行字是运行记录的入口：它本来就在说"上一次运行改了什么"，所以让它能点 */
.canvasMeta {
  display: block;
  width: 100%;
  margin-top: 4px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink3);
  font: inherit;
  font-size: 12px;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.canvasMeta:not(:disabled):hover { color: var(--ink); }
.canvasMeta:disabled { cursor: default; }
.iconBtn {
  width: 26px; height: 26px;
  padding: 0;
  display: grid; place-items: center;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--ink3);
  cursor: pointer;
}
.iconBtn svg { width: 15px; height: 15px; }
.iconBtn:hover { background: var(--hover); color: var(--ink); }

.canvasScroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.flow { padding: 12px 14px 16px; }

/* 节点 */
.node {
  position: relative;
  display: block;
  width: 100%;
  text-align: left;
  padding: 9px 11px 0;
  border: 0.5px solid var(--hairline);
  border-radius: 12px;
  background: var(--card-bg);
  box-shadow: var(--shadow-node);
  font: inherit;
  color: inherit;
  cursor: pointer;
  transition: border-color .12s, box-shadow .12s;
}
.node::before {
  content: "";
  position: absolute;
  left: 0;
  top: 13px;
  bottom: 13px;
  width: 2px;
  border-radius: 0 2px 2px 0;
  background: var(--idle);
}
.node[data-s="done"]::before { background: var(--success); }
.node[data-s="running"]::before { background: var(--accent); }
.node[data-s="failed"]::before { background: var(--danger); }
/* 待运行：虚线框 + 空心序号，跟跑过的实线卡片一眼分开（颜色之外的第二条线索） */
.node[data-s="idle"] { border-style: dashed; }
.node[data-s="idle"] .nodeIndex { background: transparent; box-shadow: inset 0 0 0 0.5px var(--hairline); color: var(--ink4); }
.node[data-s="idle"] .nodeState { color: var(--ink3); }
.node[data-s="idle"] .nodeDur { color: var(--ink4); }
.node:hover { border-color: color-mix(in srgb, var(--ink) 22%, transparent); }
.node[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent-soft); }

.nodeTop { display: flex; align-items: center; gap: 7px; }
.nodeIndex {
  flex: none;
  width: 18px; height: 18px;
  display: grid; place-items: center;
  border-radius: 5px;
  background: var(--hover);
  color: var(--ink3);
  font-family: var(--f-mono);
  font-size: 11px;
}
.node[data-s="running"] .nodeIndex { background: var(--accent-wash); color: var(--accent); }
.node[data-s="done"] .nodeIndex { color: var(--ink2); }
.nodeTitle {
  min-width: 0;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* 步骤就地改名：占的是标题那一格，样式跟着标题走，只多一圈强调边 */
.nodeTitleEdit {
  flex: 1 1 0;
  min-width: 40px;
  margin: -3px 0;
  padding: 2px 6px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  background: var(--bg-base);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  outline: none;
  box-shadow: 0 0 0 2px var(--accent-soft);
}
.nodeState {
  margin-left: auto;
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  color: var(--ink3);
  white-space: nowrap;
}
.nodeState svg { width: 12px; height: 12px; }
.node[data-s="done"] .nodeState { color: color-mix(in srgb, var(--success) 72%, var(--ink)); }
.node[data-s="running"] .nodeState { color: var(--accent); }
.node[data-s="failed"] .nodeState { color: var(--danger); }
.nodeDur {
  flex: none;
  min-width: 44px;
  text-align: right;
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ink4);
  font-variant-numeric: tabular-nums;
}
/* 轨道上放不下「技能·模型·权限」这一行，技能 id 交给右侧检查器头部显示 */
.nodeFoot {
  margin: 7px -11px 0;
  padding: 5px 11px;
  display: flex;
  align-items: center;
  gap: 6px;
  border-top: 0.5px solid var(--divider);
  border-radius: 0 0 12px 12px;
  background: var(--recess);
  font-size: 11px;
  color: var(--ink3);
  min-height: 24px;
}
.node[data-s="failed"] .nodeFoot { background: var(--danger-wash); color: var(--danger); }
.node[data-s="running"] .nodeFoot { background: var(--accent-wash); color: var(--accent); }
.nodeFoot span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 这一步的产物来自哪次运行。单点重跑之后只有它会变 */
.nodeRun { flex: none; font-family: var(--f-mono); font-size: 11px; color: var(--ink4); }
/* 产物来自单步运行：脚注写「单步 #1」，和整条运行的「#4」分开读 */
.nodeRun[data-solo="1"] { color: color-mix(in srgb, var(--success) 50%, var(--ink4)); }
.nodeProg { flex: none; width: 34px; height: 3px; border-radius: 2px; background: var(--accent-soft); overflow: hidden; }
.nodeProg i { display: block; height: 100%; width: 40%; border-radius: 2px; background: var(--accent); animation: prog 1.5s ease-in-out infinite; }
@keyframes prog { 0% { transform: translateX(-100%) } 100% { transform: translateX(280%) } }

/* 连接线 + 插入点：线和按钮叠在同一个 grid 单元格里，居中靠布局而不是靠绝对定位猜 */
.connector {
  position: relative;
  height: 24px;
  display: grid;
  place-items: center;
}
.connector::before {
  content: "";
  grid-area: 1 / 1;
  width: 1px;
  height: 100%;
  background: var(--divider);
}
.insertBtn {
  grid-area: 1 / 1;
  z-index: 1;
  width: 20px;
  height: 20px;
  /* button 元素自带 UA padding，不清零会把图标挤出边框 */
  padding: 0;
  display: grid;
  place-items: center;
  border: 0.5px solid var(--hairline);
  border-radius: 50%;
  background: var(--base);
  color: var(--ink3);
  cursor: pointer;
  /* 每条连接线上都挂一个 +，五步就是四个噪点。默认藏起来，鼠标过来或者键盘
     聚焦时才浮出；真的想加步骤，底下常驻的「添加步骤」永远在那儿 */
  opacity: 0;
  pointer-events: none;
  transition: opacity .12s, color .12s, background .12s, border-color .12s;
}
.connector:hover .insertBtn,
.connector:focus-within .insertBtn {
  opacity: 1;
  pointer-events: auto;
}
.insertBtn svg { width: 11px; height: 11px; }
.connector:hover .insertBtn {
  opacity: 1;
  border-color: color-mix(in srgb, var(--accent) 38%, transparent);
  color: var(--accent);
}
.insertBtn:hover { background: var(--accent-wash); color: var(--accent); }

.connectorShort { height: 14px; display: flex; justify-content: center; }
.connectorShort::before { content: ""; width: 1px; height: 100%; background: var(--divider); }

/* 空流水线 */
.emptyFlow {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 34px 24px;
  border: 1px dashed var(--hairline);
  border-radius: 12px;
  color: var(--ink3);
}
.emptyMark {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: 10px;
  background: var(--hover);
  color: var(--ink3);
  margin-bottom: 11px;
}
.emptyMark svg { width: 17px; height: 17px; }
.emptyFlow h4 { margin: 0 0 5px; font-size: 13px; font-weight: 500; color: var(--ink); }
.emptyFlow p { margin: 0 0 14px; max-width: 300px; font-size: 12px; line-height: 19px; }

.addStep {
  width: 100%;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px dashed var(--hairline);
  border-radius: 12px;
  background: transparent;
  color: var(--ink3);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.addStep svg { width: 13px; height: 13px; }
.addStep:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }

/* ------------------------------------------------------------------ 检查器 */
/* 结果区吃掉剩余全部宽度。执行时看的是产出，不是步骤定义。 */
.inspector {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--pane);
}

.inspHead {
  flex: none;
  position: relative;
  padding: 12px 16px 0;
}

/* 当前步骤的操作菜单：上移 / 下移 / 移除 */
.stepMenu {
  position: absolute;
  /* 落在标题行下沿：kicker + 标题行高度稳定，用固定偏移比百分比可靠 */
  top: 62px;
  right: 14px;
  z-index: 60;
  width: 184px;
  padding: 5px;
  border-radius: 10px;
  background: var(--base);
  border: 0.5px solid var(--hairline);
  box-shadow: var(--shadow-menu);
}
.stepMenuRow {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 9px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
}
.stepMenuRow svg { width: 13px; height: 13px; color: var(--ink3); }
.stepMenuRow:hover { background: var(--hover); }
.stepMenuRow[data-danger] { color: var(--danger); }
.stepMenuRow[data-danger] svg { color: var(--danger); }
.stepMenuRow[data-danger]:hover { background: var(--danger-wash); }
.stepMenuRow[disabled] { opacity: .38; cursor: default; }
.stepMenuRow[disabled]:hover { background: transparent; }
.stepMenuSep { height: 0.5px; margin: 4px 8px; background: var(--divider); }
.stepMenuNote {
  padding: 6px 9px 3px;
  color: var(--ink4);
  font-size: 11px;
  line-height: 15px;
}

/* ------------------------------------------------------- 运行的作用域菜单 */
/* 「运行」以前只有一个意思：从第一个没跑完的步骤接着跑。想让已经跑过的那几步再来
   一遍，就没有地方可以说。现在主按钮自己说出范围（运行 / 接着跑 / 重跑），右边那道
   缝后面的 ▾ 才让它改成别的范围——两个半块是同一个控件：同一个高度、共用一圈圆角，
   缝本身就是"这里还能再选"的那句话。 */
.runSplit { position: relative; display: inline-flex; align-items: center; }
/* 三个字的标签不许把按钮撑宽：否则「接着跑」和「重跑」之间，右边那道缝会左右挪 */
.runSplit .btn.primary { min-width: 96px; justify-content: center; border-radius: 8px 0 0 8px; }
.runSplitCaret {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 25px;
  height: 30px;
  padding: 0;
  border: 0;
  border-radius: 0 8px 8px 0;
  background: var(--primary-bg);
  color: var(--primary-ink);
  cursor: pointer;
  /* 中间那道缝是嵌进去的一条线，不是一个白洞：两个半边在同一个盒子里。
     隔开它们的是深浅，不是间距 */
  box-shadow: inset 1px 0 0 color-mix(in srgb, var(--primary-ink) 24%, transparent);
}
.runSplitCaret svg { width: 12px; height: 12px; }
.runSplitCaret:hover,
.runSplit[data-open="1"] .runSplitCaret { background: color-mix(in srgb, var(--primary-ink) 12%, var(--primary-bg)); }
/* 右半边不在的时候（跑起来了、没有步骤、单卡片面板），左半边自己把右边的圆角接回来 */
.runSplit[data-caret="0"] .btn { border-radius: 8px; }
/* 跑起来之后右半边收起来：`.runSplitCaret` 自己声明了 display，UA 那条 [hidden]
   赢不过它，得在这里再说一遍，否则停下之后那道缝还站在「停止」旁边 */
.runSplitCaret[hidden] { display: none; }
.runSplitCaret:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* 范围菜单：一行一个范围，行里第二句话是这次会换掉几份产物。
   两行结构（动作 + 后果）是这个菜单唯一"新"的画法——只写「从头重跑」，
   没人知道按下去要失去什么。 */
.runMenu {
  position: absolute;
  top: 36px;
  right: 0;
  z-index: 70;
  width: 276px;
  padding: 5px;
  border-radius: 10px;
  background: var(--base);
  border: 0.5px solid var(--hairline);
  box-shadow: var(--shadow-menu);
}
.runMenuRow {
  display: block;
  width: 100%;
  padding: 7px 9px 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.runMenuRow > span { display: flex; align-items: baseline; gap: 6px; }
.runMenuRow b { font-size: 13px; font-weight: 500; }
.runMenuRow i {
  font-style: normal;
  font-size: 10.5px;
  line-height: 14px;
  padding: 0 4px;
  border-radius: 4px;
  color: var(--accent);
  background: var(--accent-wash);
}
.runMenuRow em {
  display: block;
  margin-top: 2px;
  font-style: normal;
  font-size: 11px;
  line-height: 15px;
  color: var(--ink4);
}
.runMenuRow:hover { background: var(--hover); }
.runMenuRow[disabled] { opacity: .38; cursor: default; }
.runMenuRow[disabled]:hover { background: transparent; }
.inspKicker {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--ink3);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.inspKicker b { font-weight: 500; color: var(--ink2); }
.inspTitleRow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.inspTitle {
  min-width: 0;
  margin: 0;
  font-size: 15px;
  font-weight: 500;
  line-height: 22px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.runOne {
  margin-left: auto;
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 10px;
  border: 0.5px solid var(--hairline);
  border-radius: 13px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  white-space: nowrap;
  cursor: pointer;
}
.runOne svg { width: 11px; height: 11px; }
.runOne:hover { background: var(--hover-strong); }
/* 按不下去的时候要看得出来（比如这一步正在整条里跑），不然会以为点了没反应 */
.runOne:disabled { opacity: .45; cursor: default; }
.runOne:disabled:hover { background: transparent; }
.inspMeta {
  margin-top: 5px;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--ink4);
  white-space: nowrap;
  overflow: hidden;
}
.inspMeta code { font-family: var(--f-mono); font-size: 11px; color: var(--ink3); }
.chipTag {
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 7px;
  border-radius: 9px;
  background: var(--hover);
  color: var(--ink2);
  font-size: 11px;
}
.chipTag svg { flex: none; width: 10px; height: 10px; }
.chipTag[data-s="running"] { background: var(--accent-wash); color: var(--accent); }
.chipTag[data-s="done"] { background: color-mix(in srgb, var(--success) 12%, transparent); color: color-mix(in srgb, var(--success) 78%, var(--ink)); }
.chipTag[data-s="failed"] { background: var(--danger-wash); color: var(--danger); }
/* 待运行 / 排队中都是灰的，所以标签本身也换一种画法：描边、不填底 */
.chipTag[data-s="idle"] { background: transparent; border: 0.5px solid var(--hairline); color: var(--ink3); }
.chipTag[data-s="queued"] { background: var(--hover); color: var(--ink2); }
/* 和「待运行」一样描边不填底，区别只在描的是什么颜色 */
.chipTag[data-s="solo"] { background: transparent; border: 0.5px solid color-mix(in srgb, var(--success) 55%, transparent); color: color-mix(in srgb, var(--success) 60%, var(--ink)); }

.inspTabs {
  flex: none;
  display: flex;
  gap: 16px;
  margin-top: 10px;
  padding: 0 16px;
  border-bottom: 0.5px solid var(--divider);
}
.inspTab {
  height: 34px;
  padding: 0;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--ink2);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
.inspTab:hover { color: var(--ink); }
.inspTab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.inspTab em { font-style: normal; color: var(--ink4); margin-left: 3px; }

.inspScroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }

/* 结果面板 */
.resultPanel { padding: 12px 16px 18px; }
.resultBar { display: flex; align-items: center; gap: 4px; margin-bottom: 9px; }
/* 宽屏阅读跟 预览/源码 是一组：都是"换个读法"，所以贴着放，不甩到右边去 */
.resultBar .iconBtn { width: 24px; height: 24px; }

/* 重生成之后的痕迹：留着「这次是按什么要求改的」，否则改了什么会丢 */
.revised {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 11px;
  padding: 6px 9px;
  border-radius: 7px;
  background: var(--accent-wash);
  font-size: 11px;
}
.revised span { flex: none; color: var(--accent); }
.revised em {
  font-style: normal;
  min-width: 0;
  color: var(--ink2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 结果区两块：这次的结果（清单）/ 模板（预览·源码）。中间一条发丝线分开。 */
.resBlock + .resBlock { margin-top: 18px; padding-top: 15px; border-top: 0.5px solid var(--divider); }
.resBlockHead { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; font-size: 12px; font-weight: 500; }
.resBlockHead > em {
  min-width: 0;
  font-style: normal;
  font-weight: 400;
  font-size: 11px;
  color: var(--ink4);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.resBlockHead .segTiny { margin-left: auto; }

/* 这次交出来的东西：一行一个文件。窄栏只列清单，正文去阅读器读 */
.resList { display: flex; flex-direction: column; gap: 4px; }
.resItem {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border: 0.5px solid var(--hairline);
  border-radius: 8px;
  background: var(--card-bg);
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  text-align: left;
  cursor: pointer;
}
.resItem:hover { background: var(--hover); border-color: color-mix(in srgb, var(--ink) 18%, transparent); }
.resItem > svg:first-child { flex: none; width: 13px; height: 13px; color: var(--ink3); }
.resItemName { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resItemSize { flex: none; font-family: var(--f-mono); font-size: 11px; color: var(--ink4); }
/* 箭头朝右 = 进去读，不是展开 */
.resItem > svg:last-child { flex: none; width: 12px; height: 12px; color: var(--ink4); transform: rotate(-90deg); }
/* 无目录的步骤：没有清单可列，就一个按钮进去读。摘要那行在区块标题右边 */
.resOpen {
  display: inline-flex;
  align-items: center;
  /* 放在 column flex 里不被拉满，按钮就是按钮的宽度 */
  align-self: flex-start;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border: 0.5px solid var(--hairline);
  border-radius: 7px;
  background: transparent;
  color: var(--ink2);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
.resOpen:hover {
  background: var(--hover);
  color: var(--ink);
  border-color: color-mix(in srgb, var(--accent) 34%, transparent);
}
.resOpen svg:first-child { flex: none; width: 13px; height: 13px; color: var(--ink3); }
/* 摘要跟在动作后面，是同一行里的补充，不是另一句"有结果了" */
.resOpen em { font-style: normal; font-size: 11px; color: var(--ink4); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resOpen svg:last-child { flex: none; width: 12px; height: 12px; color: var(--ink4); transform: rotate(-90deg); }
.resOpen:hover svg:first-child { color: var(--accent); }
.resEmpty { padding: 10px 2px; font-size: 12px; line-height: 19px; color: var(--ink3); }
.resEmpty em { display: block; font-style: normal; font-family: var(--f-mono); font-size: 11px; color: var(--ink4); }

/* 模板预览：一块标了名字的空位。不用骨架条，那不是"占位"，那是"加载中" */
.tplSlotLabel { margin-bottom: 7px; font-size: 11px; color: var(--ink4); }
/* 预览是模板的渲染：外面只给个框，里面长什么样由模板决定 */
.tplRender {
  border: 0.5px solid var(--divider);
  border-radius: 10px;
  overflow: hidden;
  background: var(--card-bg);
  max-height: 420px;
}
.tplRender iframe { display: block; width: 100%; height: 320px; border: 0; }

.tplSlotBox {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 18px 14px;
  border: 0.5px dashed var(--hairline);
  border-radius: 9px;
  background: var(--recess);
}
.tplSlotTag {
  flex: none;
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--hover-strong);
  font-size: 11px;
  color: var(--ink2);
}
.tplSlotText { min-width: 0; font-size: 12px; line-height: 17px; color: var(--ink3); }

/* 源头说明：告诉读者「源码」只是区域片段，文件正文不在里面 */
.srcNote {
  /* 横向 padding 由 .resultPanel 给，这里只补下方间距 */
  padding: 0 0 9px;
  font-size: 11px;
  line-height: 16px;
  color: var(--ink4);
}
.srcNote code { font-family: var(--f-mono); font-size: 11px; }

/* 源码那一栏：卡片的 HTML 模板全文，等宽、可滚、底色压暗。
   区域标记之间就是模型每次执行要替换的那段。 */
.docSrc {
  margin: 0;
  padding: 10px 12px;
  border: 0.5px solid var(--divider);
  border-radius: 10px;
  /* 能编辑的框得看起来能编辑：压暗的底 + 次要墨色读起来像禁用 */
  background: var(--card-bg);
  color: var(--ink);
  cursor: text;
  font-family: var(--f-mono);
  font-size: 11px;
  line-height: 17px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 420px;
  overflow-y: auto;
}
/* 区域标记要能一眼看见，否则一段 90 行的模板里找不到「模型写哪儿」 */
.docSrc .mk { color: var(--accent); }

/* 编辑框和只读的源码同一套字：等宽 11px、17px 行高 */
.docSrc { display: block; width: 100%; box-sizing: border-box; min-height: 160px; resize: vertical; }
.docSrc:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-wash); }
.segTiny { display: flex; gap: 1px; padding: 1px; border-radius: 6px; background: var(--hover); }
.segTiny button {
  border: 0;
  padding: 2px 8px;
  border-radius: 5px;
  background: transparent;
  color: var(--ink3);
  font: inherit;
  font-size: 11px;
  cursor: pointer;
}
.segTiny button[aria-pressed="true"] { background: var(--base); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.resultBar .spacer { flex: 1; }
.docPad {
  border: 0.5px solid var(--divider);
  border-radius: 10px;
  background: var(--base);
  padding: 12px 14px 14px;
}
.docPad[data-tone="danger"] { background: var(--danger-wash); border-color: color-mix(in srgb, var(--danger) 28%, transparent); }

/* 结果文档 */
.doc { color: var(--ink); font-size: 13px; line-height: 20px; }
.doc h5 { margin: 0 0 7px; font-size: 13px; font-weight: 500; line-height: 20px; }
.doc h6 { margin: 11px 0 5px; font-size: 11px; font-weight: 500; color: var(--ink3); letter-spacing: .02em; }
.doc p { margin: 0 0 9px; }
.doc ul { margin: 0 0 8px; padding-left: 16px; }
.doc li { margin-bottom: 3px; }
.doc code { font-family: var(--f-mono); font-size: 11px; padding: 1px 4px; border-radius: 4px; background: var(--hover); }
.doc strong { font-weight: 500; }
.doc table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 0 0 9px; font-size: 12px; }
.doc th:nth-child(1), .doc td:nth-child(1) { width: 44%; }
.doc th:nth-child(2), .doc td:nth-child(2) { width: 34%; }
.doc th:nth-child(3), .doc td:nth-child(3) { width: 22%; }
.doc th {
  text-align: left;
  font-weight: 400;
  font-size: 11px;
  color: var(--ink4);
  padding: 0 0 5px;
  border-bottom: 0.5px solid var(--divider);
}
.doc td { padding: 6px 0; border-bottom: 0.5px solid var(--divider); vertical-align: top; overflow-wrap: anywhere; }
.doc tr:last-child td { border-bottom: 0; }
.doc .num { text-align: right; font-family: var(--f-mono); font-size: 11px; }
.doc .add { color: rgb(34, 160, 90); }
.doc .del { color: var(--danger); }
.doc .callout {
  margin: 9px 0 0;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--accent-wash);
  color: var(--ink2);
  font-size: 12px;
  line-height: 18px;
}
.doc .checks { margin: 0; }
.doc .check { display: flex; align-items: flex-start; gap: 7px; padding: 5px 0; font-size: 12px; border-bottom: 0.5px solid var(--divider); }
.doc .check:last-child { border-bottom: 0; }
.doc .check i { flex: none; width: 11px; height: 11px; margin-top: 4px; border-radius: 50%; background: var(--success); }
.doc .check[data-s="todo"] i { background: var(--idle); }
.doc .check span { flex: 1; min-width: 0; }
.doc .check em { flex: none; font-style: normal; font-family: var(--f-mono); font-size: 11px; color: var(--ink4); }
.doc .metrics { display: flex; gap: 8px; margin: 0 0 9px; }
.doc .metric { flex: 1; padding: 8px 10px; border-radius: 8px; background: var(--hover); }
.doc .metric .k { display: block; font-size: 11px; color: var(--ink3); }
.doc .metric .v { display: block; margin-top: 1px; font-size: 17px; font-weight: 500; line-height: 22px; }
.doc .metric small { font-size: 11px; font-weight: 400; color: var(--ink4); }


/* 结果占位：运行中 / 排队 / 未运行 / 失败 */
.stateBlock { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 4px 0 2px; }
.stateBlock h6 { margin: 0; font-size: 13px; font-weight: 500; color: var(--ink); }
.stateBlock p { margin: 0; color: var(--ink3); font-size: 12px; line-height: 19px; }
.skel { display: flex; flex-direction: column; gap: 7px; }
.skel i {
  display: block;
  height: 9px;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--hover) 25%, var(--hover-strong) 37%, var(--hover) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}
@keyframes shimmer { 0% { background-position: 100% 0 } 100% { background-position: 0 0 } }
.inlineFail {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 9px 11px;
  border-radius: 9px;
  background: var(--danger-wash);
  color: var(--danger);
  font-size: 12px;
  line-height: 18px;
}
.inlineFail svg { flex: none; width: 14px; height: 14px; margin-top: 2px; }
.inlineFail b { display: block; font-weight: 500; }
.inlineFail em { display: block; font-style: normal; color: var(--ink2); margin-top: 2px; }

/* 活动时间线 */
.activityPanel { padding: 10px 16px 18px; }
.actList { display: flex; flex-direction: column; }
.act {
  position: relative;
  display: flex;
  gap: 9px;
  padding: 0 0 13px;
}
.act:last-child { padding-bottom: 0; }
.act::before {
  content: "";
  position: absolute;
  left: 6px;
  top: 16px;
  bottom: 0;
  width: 1px;
  background: var(--divider);
}
.act:last-child::before { display: none; }
.actIcon {
  position: relative;
  z-index: 1;
  flex: none;
  width: 13px; height: 13px;
  margin-top: 2px;
  display: grid;
  place-items: center;
  background: var(--pane);
  color: var(--ink4);
}
.actIcon svg { width: 11px; height: 11px; }
.act[data-k="done"] .actIcon { color: var(--success); }
.act[data-k="fail"] .actIcon { color: var(--danger); }
.act[data-k="write"] .actIcon { color: var(--accent); }
.actBody { min-width: 0; flex: 1; }
.actTop { display: flex; align-items: baseline; gap: 6px; }
.actName { font-size: 12px; color: var(--ink); white-space: nowrap; }
.actArg {
  min-width: 0;
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ink3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.actT { margin-left: auto; flex: none; font-family: var(--f-mono); font-size: 11px; color: var(--ink4); }
.actMsg { margin-top: 2px; color: var(--ink2); font-size: 12px; line-height: 17px; }
.actDur { margin-top: 1px; font-family: var(--f-mono); font-size: 11px; color: var(--ink4); }

/* 配置面板 */
.configPanel { padding: 12px 16px 18px; }
/* 配置分三层：整条流水线 / 这一步 / 模板。三层之间一条发丝线。 */
.cfgBlock + .cfgBlock { margin-top: 16px; padding-top: 14px; border-top: 0.5px solid var(--divider); }
.cfgBlockHead {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 2px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
}
.cfgBlockHead > em { min-width: 0; font-style: normal; font-weight: 400; font-size: 11px; color: var(--ink4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cfgBlockHead .segTiny { margin-left: auto; }
/* 真下拉，不是长得像下拉的死按钮 */
.ruleSelect {
  display: block;
  max-width: 240px;
  padding: 4px 8px;
  border: 0.5px solid var(--hairline);
  border-radius: 7px;
  background: var(--card-bg);
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.ruleSelect:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* 能改的行：路径和指令是文本，给输入框，样式和下拉对齐 */
.ruleInput,
.ruleArea {
  display: block;
  width: 100%;
  max-width: 420px;
  padding: 5px 8px;
  border: 0.5px solid var(--hairline);
  border-radius: 7px;
  background: var(--card-bg);
  color: var(--ink);
  font: inherit;
  font-size: 12px;
}
.ruleInput { font-family: var(--f-mono); }
.ruleArea { max-width: 100%; line-height: 1.5; resize: vertical; }
/* 工作目录不是手填的：一行可点的选择器，左边是确认过的路径，右边是「选择目录」 */
.rulePath {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 420px;
  padding: 6px 10px;
  border: 0.5px solid var(--hairline);
  border-radius: 7px;
  background: var(--card-bg);
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.rulePath:hover { border-color: color-mix(in srgb, var(--ink) 22%, transparent); background: var(--hover); }
.rulePath:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rulePathText { flex: 1; min-width: 0; font-size: 12px; font-family: var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rulePathPick { flex: none; font-size: 11px; color: var(--accent); }

.ruleInput:hover,
.ruleArea:hover { border-color: color-mix(in srgb, var(--ink) 22%, transparent); }
.ruleInput:focus-visible,
.ruleArea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.ruleRow {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 46px;
  padding: 10px 0;
  border-bottom: 0.5px solid var(--divider);
}
.ruleRow:last-child { border-bottom: 0; }
.ruleLabel { flex: none; width: 76px; color: var(--ink3); font-size: 12px; }
.ruleValue { flex: 1; min-width: 0; }
.ruleValue .val {
  display: block;
  font-size: 13px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ruleValue .val.mono { font-family: var(--f-mono); font-size: 12px; }
/* 提示是给控件的注解，不是控件的一部分：和上方的值/控件留 5px，
   否则贴着输入框边框，看起来像框里掉出来的一行。 */
.ruleValue .hint { display: block; margin-top: 5px; color: var(--ink4); font-size: 11px; line-height: 1.45; }

/* ----------------------------------------------------------------- 运行条 */
.runbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 46px;
  padding: 0 16px;
  border-top: 0.5px solid var(--hairline);
  background: var(--pane);
}
.segBar { flex: none; display: flex; gap: 3px; }
/* 运行条不只靠颜色区分状态：完成了是实心，排队是空心的点阵，失败是斜纹 */
.segBar i { display: block; width: 22px; height: 4px; border-radius: 2px; background: var(--divider); }
.segBar i[data-s="done"] { background: var(--success); }
.segBar i[data-s="running"] {
  background: repeating-linear-gradient(90deg, var(--accent) 0 4px, color-mix(in srgb, var(--accent) 38%, transparent) 4px 8px);
}
.segBar i[data-s="failed"] {
  background: repeating-linear-gradient(45deg, var(--danger) 0 2px, transparent 2px 5px);
  box-shadow: inset 0 0 0 0.5px var(--danger);
}
.segBar i[data-s="queued"] {
  background: repeating-linear-gradient(90deg, var(--ink4) 0 1.5px, transparent 1.5px 4px);
  opacity: .75;
}
/* 被停下、没跑完的那一步：浅实心。和「排队中」的点阵（还会跑）、完成的实绿都不一样 */
.segBar i[data-s="stopped"] { background: color-mix(in srgb, var(--ink4) 45%, transparent); }
/* 单独跑过的一步：段是空心的。整条跑完的段才填满——运行条本身就在说「没从头跑过」 */
/* 4px 高的条上只描一圈太淡，所以里面留一层很浅的绿：不填满 = 没整条跑过 */
.segBar i[data-s="solo"] {
  background: color-mix(in srgb, var(--success) 22%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--success) 58%, transparent);
}
.runNoise { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; }
.runNoise b { font-weight: 500; color: var(--ink); }
.runNoise .timer { font-family: var(--f-mono); font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }


/* 点 */
.dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--idle); }
.dot[data-s="done"] { background: var(--success); }
.dot[data-s="running"] { background: var(--accent); }
.dot[data-s="failed"] { background: var(--danger); }
.dot[data-s="queued"] { background: var(--idle); }
/* 待运行的圆点是空心的：实心/空心这一层差在 6px 上也看得出来 */
.dot[data-s="idle"] { background: transparent; box-shadow: inset 0 0 0 1px var(--ink4); }
.dot[data-s="stopped"] { background: var(--ink4); }
/* 只单独跑过：空心绿。填满的绿点才是整条跑完 */
.dot[data-s="solo"] { background: transparent; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--success) 70%, transparent); }

/* ------------------------------------------------------------- 标题下拉菜单 */
.renameInput {
  width: 190px;
  max-width: 100%;
  padding: 2px 6px;
  border: 0.5px solid var(--accent);
  border-radius: 6px;
  background: var(--base);
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  outline: none;
}
.pickerUsed { flex: none; font-size: 11px; color: var(--ink4); }
.canvasMenu {
  position: absolute;
  top: calc(100% - 2px);
  left: 18px;
  z-index: 60;
  width: min(330px, calc(100% - 36px));
  max-height: min(440px, calc(100vh - 220px));
  overflow-y: auto;
  padding: 5px;
  border-radius: 12px;
  background: var(--base);
  border: 0.5px solid var(--hairline);
  box-shadow: var(--shadow-menu);
}
.menuSect {
  padding: 6px 8px 4px;
  color: var(--ink4);
  font-size: 11px;
  letter-spacing: .02em;
}
.menuRow {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 8px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
}
.menuRow:hover { background: var(--hover); }
.menuRow[aria-current="true"] { background: var(--hover-strong); }
.menuRowMain { flex: 1; min-width: 0; }
.menuRowTitle { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menuRowSub { display: block; margin-top: 1px; color: var(--ink4); font-size: 11px; font-family: var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menuRowTail { flex: none; display: flex; align-items: center; gap: 6px; color: var(--ink4); font-size: 11px; }
.menuRun {
  flex: none;
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ink3);
  cursor: pointer;
  opacity: 0;
}
.menuRun svg { width: 11px; height: 11px; }
.menuRow:hover .menuRun { opacity: 1; }
.menuRun:hover { background: var(--hover-strong); color: var(--ink); }
.menuSep { height: 0.5px; margin: 5px 8px; background: var(--divider); }

/* ------------------------------------------------------------ 任务选择器 */
.pickerWrap { position: absolute; inset: 0; z-index: 80; display: flex; align-items: flex-start; justify-content: center; padding-top: 84px; }
.pickerScrim { position: absolute; inset: 0; background: var(--scrim); }
.picker {
  position: relative;
  width: min(400px, calc(100% - 32px));
  max-height: min(430px, calc(100% - 140px));
  display: flex;
  flex-direction: column;
  border-radius: 14px;
  background: var(--base);
  border: 0.5px solid var(--hairline);
  box-shadow: var(--shadow-menu);
  overflow: hidden;
}
.pickerHead { flex: none; padding: 11px 12px 9px; border-bottom: 0.5px solid var(--divider); }
.pickerTitle { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 13px; font-weight: 500; }
.pickerTitle span { flex: 1; min-width: 0; }
.pickerTitle em { font-style: normal; font-weight: 400; color: var(--ink4); font-size: 11px; }
.searchField {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 9px;
  border-radius: 8px;
  background: var(--recess);
  border: 0.5px solid var(--divider);
}
.searchField svg { flex: none; width: 13px; height: 13px; color: var(--ink4); }
.searchField input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  outline: none;
}
.searchField input::placeholder { color: var(--ink4); }
.pickerList { flex: 1; min-height: 0; overflow-y: auto; padding: 5px; }
.pickerRow {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.pickerRow:hover { background: var(--hover); }
.pickerRow svg { width: 13px; height: 13px; color: var(--ink4); }
.pickerRow:hover svg { color: var(--accent); }
.pickerRowMain { flex: 1; min-width: 0; }
.pickerRowTitle { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pickerRowSub { display: block; margin-top: 1px; font-family: var(--f-mono); font-size: 11px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pickerEmpty { padding: 16px 8px; text-align: center; color: var(--ink4); font-size: 12px; }

/* ------------------------------------------------------------ 运行记录 */
/*
 * 一条记录 = 一次流水线运行 = 它当时每一步的状态与产物快照。
 * 回看某一次，看到的是那天的文件，不是今天被改过的同一份——所以产物必须跟着
 * 那次运行存，而不是回读磁盘。
 */
.histBody { flex: 1; min-height: 0; overflow-y: auto; }

.histDay {
  position: sticky;
  top: 0;
  z-index: 1;
  padding: 9px 14px 6px;
  background: var(--base);
  font-size: 11px;
  color: var(--ink4);
  border-bottom: 0.5px solid var(--divider);
}

.histRow {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 14px;
  font: inherit;
  text-align: left;
  background: transparent;
  border: 0;
  border-bottom: 0.5px solid var(--divider);
  cursor: pointer;
}
.histRow:hover { background: var(--hover); }
.histNo { flex: none; width: 28px; font-family: var(--f-mono); font-size: 11px; color: var(--ink4); }
.histWhen { flex: none; width: 92px; font-size: 12px; }
.histSum {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  color: var(--ink3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.histTook { flex: none; font-family: var(--f-mono); font-size: 11px; color: var(--ink4); }
.histBadge { flex: none; width: 44px; font-size: 11px; }
.histBadge[data-s="ok"] { color: rgb(34, 160, 90); }
.histBadge[data-s="fail"] { color: var(--danger); }
.histBadge[data-s="running"] { color: var(--accent); }
.histBadge[data-s="stopped"] { color: var(--ink3); }
.histRow > svg { flex: none; width: 12px; height: 12px; color: var(--ink4); }

/* 详情 */
.histTop {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 0.5px solid var(--divider);
}
.histTopWhen { font-size: 12px; font-weight: 500; }
.histTopMeta { min-width: 0; font-size: 11px; color: var(--ink4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.histReadonly {
  flex: none;
  margin-left: auto;
  padding: 2px 7px;
  border-radius: 20px;
  background: var(--recess);
  font-size: 11px;
  color: var(--ink3);
}

/* 重生成那条运行带着"要改什么"，回看时它就是这次改动的由来 */
.histAsk {
  padding: 9px 14px;
  background: var(--accent-wash);
  font-size: 12px;
  line-height: 17px;
  color: var(--ink2);
  border-bottom: 0.5px solid var(--divider);
}

.hStep {
  position: relative;
  border-bottom: 0.5px solid var(--divider);
}
.hStep:last-child { border-bottom: 0; }
/* 失败的那一步在快照里没有产物可读，但可以现在就重跑 */
.hStepRetry {
  position: absolute;
  top: 50%;
  right: 12px;
  transform: translateY(-50%);
  padding: 2px 9px;
  border: 0.5px solid var(--hairline);
  border-radius: 6px;
  background: var(--base);
  color: var(--ink2);
  font: inherit;
  font-size: 11px;
  cursor: pointer;
}
.hStepRetry:hover { background: var(--hover); color: var(--ink); }
.hStepMuted { padding-right: 82px; }
.hStepHead {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 11px 14px;
  font: inherit;
  text-align: left;
  background: transparent;
  border: 0;
  cursor: pointer;
}
.hStepHead:hover { background: var(--hover); }
.hStepNo { flex: none; width: 15px; font-family: var(--f-mono); font-size: 11px; color: var(--ink4); }
.hStepName { flex: none; font-size: 13px; }
.hStepMeta { flex: 1; min-width: 0; font-size: 11px; color: var(--ink4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hStepTook { flex: none; font-family: var(--f-mono); font-size: 11px; color: var(--ink4); }
/* 这一步的产物是点开看的：箭头朝右表示"进去"，不是一个会展开的手风琴 */
.hStepHead > svg { flex: none; width: 12px; height: 12px; color: var(--ink4); transform: rotate(-90deg); transition: transform .14s; }
.hStepHead:hover > svg { transform: rotate(-90deg) translateY(-2px); }

/* 返回箭头：chev 朝下，转 90° 朝左 */
#histBack svg { transform: rotate(90deg); }

/* 没东西可点的那一步（还没跑）：同样的格子，但不是按钮 */
.hStepMuted { cursor: default; }
.hStepMuted:hover { background: transparent; }
.hStepMuted .hStepName { color: var(--ink3); }

.hError {
  padding: 9px 11px;
  border-radius: 8px;
  background: var(--danger-wash);
  font-size: 12px;
  color: var(--danger);
}
/* ------------------------------------------------------------ 阅读器 */
/*
 * 读长文的唯一地方。
 *
 * 结果区那列最宽 690，去掉留白只剩 650——一份五万字的文档摆进去就是条窄带子，
 * 所以正文要在宽的场合读：从结果区打开读「现在这份」，从运行记录打开读「第 N 次那份」。
 * 两处是同一个阅读器，只是身份不同（live / snapshot），差别只在标题和一条只读提示。
 */
.zoomWrap { position: absolute; inset: 0; z-index: 78; display: flex; padding: 10px; }
/* 阅读器会盖在运行记录上面（从历史里点开一步就是），所以它得在上一级 */
#zoomWrap { z-index: 79; }
.zoomScrim { position: absolute; inset: 0; background: var(--scrim); }
.zoom {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  border-radius: 14px;
  background: var(--base);
  border: 0.5px solid var(--hairline);
  box-shadow: var(--shadow-menu);
  overflow: hidden;
}
.zoomHead {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 14px 10px;
  border-bottom: 0.5px solid var(--divider);
}
.zoomKicker { flex: none; font-size: 13px; font-weight: 500; }
.zoomMeta {
  min-width: 0;
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ink4);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.zoomHint { flex: none; margin-left: auto; font-size: 11px; color: var(--ink4); }

/* 文件清单照旧横向排、长名省略号，只是宽裕了所以能放得更长 */
.zoomFiles { display: flex; flex-wrap: wrap; gap: 5px; padding: 10px 14px; border-bottom: 0.5px solid var(--divider); }
.zoomFiles:empty { display: none; }
.zFile {
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 380px;
  min-width: 0;
  padding: 6px 10px;
  border: 0.5px solid var(--divider);
  border-radius: 8px;
  background: transparent;
  color: var(--ink3);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.zFile svg { flex: none; width: 13px; height: 13px; color: var(--ink4); }
.zFile:hover { background: var(--hover); color: var(--ink); }
.zFile[aria-pressed="true"] { background: var(--hover-strong); border-color: var(--hairline); color: var(--ink); }
.zFile[aria-pressed="true"] svg { color: var(--accent); }
.zName { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zFile[aria-pressed="true"] .zName { font-weight: 500; }
.zSize { flex: none; font-family: var(--f-mono); font-size: 11px; color: var(--ink4); }

.zoomBody { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 26px; }
/* 历史快照：说清楚"这不是现在磁盘上的那份" */
.zoomWarn {
  flex: none;
  padding: 8px 18px;
  border-bottom: 0.5px solid var(--divider);
  background: var(--recess);
  font-size: 11px;
  line-height: 16px;
  color: var(--ink3);
}

/* 面积大了一倍，正文也该松一档，不然字全挤在左边一小条里 */
.zoomBody .doc { font-size: 13px; line-height: 22px; }
.zoomBody .doc h5 { margin-bottom: 9px; font-size: 15px; line-height: 22px; }
.zoomBody .doc h6 { margin: 16px 0 6px; font-size: 12px; }
.zoomBody .doc p { margin-bottom: 11px; }
.zoomBody .doc td { padding: 8px 14px 8px 0; }
.zoomBody .doc td:last-child { padding-right: 0; }
/* 结果区的表格是固定比例（给窄列用的），放大后按内容分 */
.zoomBody .doc table { table-layout: auto; font-size: 13px; }
.zoomBody .doc th:nth-child(1), .zoomBody .doc td:nth-child(1),
.zoomBody .doc th:nth-child(2), .zoomBody .doc td:nth-child(2),
.zoomBody .doc th:nth-child(3), .zoomBody .doc td:nth-child(3) { width: auto; }

/* ------------------------------------------------------------ 审核（提要求重生成） */
/* 和任务选择器同一套外壳：同一块面板里，两个浮层的形状不该有两套语言 */
.reviewWrap { position: absolute; inset: 0; z-index: 85; display: flex; align-items: flex-start; justify-content: center; padding-top: 84px; }
.reviewScrim { position: absolute; inset: 0; background: var(--scrim); }
.review {
  position: relative;
  width: min(420px, calc(100% - 32px));
  display: flex;
  flex-direction: column;
  border-radius: 14px;
  background: var(--base);
  border: 0.5px solid var(--hairline);
  box-shadow: var(--shadow-menu);
  overflow: hidden;
}
.reviewHead { padding: 12px 13px 10px; border-bottom: 0.5px solid var(--divider); }
.reviewTitle { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.reviewTitle span { flex: 1; min-width: 0; }
.reviewTitle em { font-style: normal; font-weight: 400; color: var(--ink4); font-size: 11px; }
.reviewWho {
  margin-top: 5px;
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ink3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.reviewBody { padding: 11px 13px 0; }
.reviewArea {
  display: block;
  width: 100%;
  min-height: 84px;
  max-height: 180px;
  padding: 9px 10px;
  border: 0.5px solid var(--divider);
  border-radius: 9px;
  background: var(--recess);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  line-height: 19px;
  resize: vertical;
  outline: none;
}
.reviewArea::placeholder { color: var(--ink4); }
.reviewArea:focus { border-color: color-mix(in srgb, var(--accent) 42%, transparent); }
.reviewChips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.reviewChip {
  padding: 4px 9px;
  border: 0.5px solid var(--hairline);
  border-radius: 7px;
  background: transparent;
  color: var(--ink3);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.reviewChip:hover { background: var(--hover); color: var(--ink); }
.reviewNote { margin-top: 9px; font-size: 11px; line-height: 16px; color: var(--ink4); }
/* 从历史快照点进来的：先讲清楚"重做的是现在这一步，不是那条记录" */
.reviewFrom {
  margin: 0 0 9px;
  padding: 7px 10px;
  border-radius: 8px;
  background: var(--recess);
  font-size: 11px;
  line-height: 16px;
  color: var(--ink3);
}
.zoomHead .zoomReview { flex: none; height: 24px; padding: 0 9px; font-size: 12px; }
.reviewFoot {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 11px 13px;
}
.reviewFoot .spacer { flex: 1; }

/* ============================ 断点（容器查询，按面板宽度） ============================ */
/* 轨道宽度阶梯：面板越宽，轨道稍微放宽一点，但永远是配角；
   低于 700 时轨道改成横向条，结果仍然占满整块。 */

@container panel (min-width: 1200px) {
  .canvas { width: 312px; }
  .flow { padding: 14px 16px 18px; }
}

@container panel (min-width: 900px) and (max-width: 1199.98px) {
  .canvas { width: 280px; }
}

@container panel (min-width: 700px) and (max-width: 899.98px) {
  .canvas { width: 248px; }
  .flow { padding: 11px 12px 14px; }
  .canvasHead { padding: 11px 12px 9px; }
}

/* < 700：竖轨道放不下，改成顶部横向步骤条，结果独占整块 */
@container panel (max-width: 699.98px) {
  .panes { flex-direction: column; }
  .canvas {
    width: 100%;
    border-right: 0;
    border-bottom: 0.5px solid var(--divider);
  }
  .canvasScroll { display: none; }
  .stepStrip { display: flex; }
  .canvasHead { padding: 10px 12px 8px; }
  .panelHead { height: 52px; padding: 0 14px; }
  .panelHead h1 { font-size: 17px; }
  .headLabel { display: none; }
  /* 字没了，那个 96px 的最小宽度就只剩空白：按图标宽度收回原样，右半边照旧留着 */
  .runSplit .btn.primary { min-width: 0; padding: 0 9px; }
  .runbar { padding: 0 12px; gap: 8px; }
  .segBar i { width: 14px; }
}

/* ---------------------------------------------------------------- 步骤横条 */
.stepStrip {
  display: none;
  gap: 6px;
  overflow-x: auto;
  padding: 7px 12px;
  scrollbar-width: none;
}
.stepStrip::-webkit-scrollbar { display: none; }
.stepChip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 30px;
  padding: 0 10px;
  border: 0.5px solid var(--hairline);
  border-radius: 8px;
  background: var(--card-bg);
  color: var(--ink2);
  font: inherit;
  font-size: 12px;
  white-space: nowrap;
  cursor: pointer;
}
.stepChip b {
  font-weight: 500;
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ink4);
}
.stepChip:hover { background: var(--hover); }
.stepChip[aria-selected="true"] { border-color: var(--accent); color: var(--ink); background: var(--accent-wash); }
.stepChip[aria-selected="true"] b { color: var(--accent); }
.stepChip[data-s="failed"] { color: var(--danger); }
.stepChip[data-s="failed"] .dot { background: var(--danger); }

/* ---------------------------------------------------------------- 滚动条 */
.scroll::-webkit-scrollbar, .canvasScroll::-webkit-scrollbar, .inspScroll::-webkit-scrollbar,
.histBody::-webkit-scrollbar, .zoomBody::-webkit-scrollbar,
.pickerList::-webkit-scrollbar, .canvasMenu::-webkit-scrollbar { width: 9px; height: 9px; }
.scroll::-webkit-scrollbar-thumb, .canvasScroll::-webkit-scrollbar-thumb, .inspScroll::-webkit-scrollbar-thumb,
.histBody::-webkit-scrollbar-thumb, .zoomBody::-webkit-scrollbar-thumb,
.pickerList::-webkit-scrollbar-thumb, .canvasMenu::-webkit-scrollbar-thumb {
  border: 2px solid transparent;
  border-radius: 6px;
  background: var(--scroll);
  background-clip: content-box;
}
</style>
</head>
<body data-theme="light">

<div class="protoBar">
  <span class="pbTitle">两栏版</span>
  <div class="pbSeg" id="themeSeg">
    <button type="button" data-theme-btn="light" aria-pressed="true">浅色</button>
    <button type="button" data-theme-btn="dark" aria-pressed="false">深色</button>
  </div>
  <div class="pbSeg" id="widthSeg">
    <button type="button" data-w="1280" aria-pressed="true">1280 大窗口</button>
    <button type="button" data-w="1000" aria-pressed="false">1000 默认窗口</button>
    <button type="button" data-w="844" aria-pressed="false">844 最小窗口</button>
    <button type="button" data-w="760" aria-pressed="false">760 断点</button>
    <button type="button" data-w="424" aria-pressed="false">424 右面板</button>
  </div>
  <span class="pbTitle">场景</span>
  <div class="pbSeg" id="sceneSeg" aria-label="场景">
    <button type="button" data-scene="steps" aria-pressed="true">有步骤</button>
    <button type="button" data-scene="zero" aria-pressed="false">0 步流水线</button>
<button type="button" data-scene="idle" aria-pressed="false">待运行</button>
    <button type="button" data-scene="solo" aria-pressed="false">单步跑过</button>
    <button type="button" data-scene="done" aria-pressed="false">全部完成</button>
    <button type="button" data-scene="none" aria-pressed="false">没有流水线</button>
  </div>
</div>

<div class="app" id="app" style="--panel-w:1280px">
  <main class="panel" id="panel">
    <header class="panelHead">
      <h1>工作台</h1>
      <div class="headSpacer"></div>
      <button class="btn ghost" type="button" id="newPipelineBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3.4v9.2M3.4 8h9.2"/></svg>
        <span class="headLabel">新建流水线</span>
      </button>
      <!-- 一个控件两种读法：左半边说这一次要跑什么（运行 / 接着跑 / 重跑，跑起来是
           「停止」），右半边那道缝后面才换范围。停止时右半边收起来——那一次运行只有
           一个出口，不该在旁边摆一个"要不要再跑一遍" -->
      <div class="runSplit" id="runSplit" data-open="0">
        <button class="btn primary" type="button" id="runAllBtn">
          <svg class="glyphPlay" viewBox="0 0 16 16" fill="currentColor"><path d="M4.6 2.9c0-.5.5-.8.9-.6l7.1 4.2c.4.2.4.8 0 1l-7.1 4.2c-.4.2-.9-.1-.9-.6z"/></svg>
          <svg class="glyphStop" viewBox="0 0 16 16" fill="currentColor"><rect x="4.5" y="4.5" width="7" height="7" rx="1.3"/></svg>
          <span class="headLabel" id="runAllLabel">运行</span>
        </button>
        <button class="runSplitCaret" type="button" id="runScopeBtn" aria-label="选择运行范围" aria-haspopup="menu" aria-expanded="false" title="选择运行范围">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m4.6 6.4 3.4 3.2 3.4-3.2"/></svg>
        </button>
        <div class="runMenu" id="runMenu" role="menu" aria-label="运行范围" hidden></div>
      </div>
    </header>

    <div class="panelBody">
      <!-- ============================ 流水线视图 ============================ -->
      <section class="pipelineView" id="viewPipeline">
        <div class="panes">
          <div class="canvas">
            <div class="canvasHead">
              <div style="min-width:0;flex:1">
                <div class="canvasTitleRow">
                  <span id="canvasTitleWrap">
                    <span class="canvasTitleBtn" id="canvasTitlePlain" hidden>流水线</span>
                    <button class="canvasTitleBtn" type="button" id="titleBtn">
                      <span id="canvasTitle">需求到交付</span>
                      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4.4 6.4 3.6 3.4 3.6-3.4"/></svg>
                    </button>
                    <input class="renameInput" id="renameInput" hidden aria-label="流水线名称" maxlength="24">

                </div>

              <div class="canvasMenu" id="canvasMenu" hidden></div>
            </div>
            <div class="canvasScroll scroll" id="canvasScroll">
              <div class="flow" id="flow"></div>
            </div>
            <div class="stepStrip" id="stepStrip"></div>
          </div>

          <aside class="inspector" id="inspector">
            <div class="inspHead">
              <div class="inspKicker" id="inspKicker">
                <span>第 3 步 / 共 5 步 · 需求到交付</span>
              </div>
              <div class="inspTitleRow">
                <h2 class="inspTitle" id="inspTitle">代码实现</h2>
                <!-- 同理：这一步没在跑是「单独运行」，正在单独跑就是它的「停止」 -->
                <button class="runOne" type="button" id="runOneBtn">
                  <svg class="glyphPlay" viewBox="0 0 16 16" fill="currentColor"><path d="M4.6 2.9c0-.5.5-.8.9-.6l7.1 4.2c.4.2.4.8 0 1l-7.1 4.2c-.4.2-.9-.1-.9-.6z"/></svg>
                  <svg class="glyphStop" viewBox="0 0 16 16" fill="currentColor"><rect x="4.5" y="4.5" width="7" height="7" rx="1.3"/></svg>
                  <span id="runOneLabel">单独运行</span>
                </button>
                <button class="iconBtn" type="button" id="stepMoreBtn" aria-label="步骤操作" aria-haspopup="menu" aria-expanded="false">
                  <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.4" cy="8" r="1.15"/><circle cx="8" cy="8" r="1.15"/><circle cx="12.6" cy="8" r="1.15"/></svg>
                </button>
              </div>
              <div class="stepMenu" id="stepMenu" role="menu" hidden></div>
              <div class="inspMeta" id="inspMeta"></div>
