  PIPELINES.forEach(p => (p.stages || []).forEach(st => {
    const task = TASKS.find(t => t.skill === st.skill);
    if (st.instruction === undefined) st.instruction = (task || {}).instruction || '按这个技能的要求做完，产物写成一页摘要。';
    if (st.fail === undefined) st.fail = '停止后续步骤';
  }));

  const NO_PIPELINE = { id: '__none', name: '流水线', state: 'idle', stages: [], updated: '—', none: true };
  const current = () => {
    if (state.scene === 'none') return NO_PIPELINE;
    if (state.focus.kind === 'task') {
      const t = TASKS.find(x => x.skill === state.focus.id);
      const r = TASK_RESULTS[t.skill];
      return {
        name: t.name, state: r ? 'done' : 'idle', isTask: true, updated: r ? r.when : '—', total: null,
        stages: [{
          skill: t.skill, status: r ? r.status : 'idle', dur: r ? r.dur : '—',
          summary: r ? r.summary : '', dir: r && r.dir, doc: r && r.doc,
          files: r ? r.files : [], acts: r ? r.acts : [],
        }],
      };
    }
    return PIPELINES.find(p => p.id === state.focus.id) || PIPELINES[0];
  };

  /** 写一步的状态。单任务写进 TASK_RESULTS，流水线直接写它自己的 stage。 */
  function writeStage(flow, i, patch) {
    const st = flow.stages[i];
    if (flow.isTask) TASK_RESULTS[st.skill] = { ...(TASK_RESULTS[st.skill] || {}), ...patch };
    else Object.assign(st, patch);
  }
  const stageAt = (i) => current().stages[i] || current().stages[0];

  /* 状态标签：颜色之外还有一个形状，色弱的人也能分清「完成」和「失败」 */
  // 每个状态一个记号：待运行是"空槽位"（虚线方框），排队中才是"在队里"（虚线圆）
  const STAGE_ICON = { done: 'check', running: 'clock', failed: 'warn', queued: 'dash', idle: 'slot', stopped: 'x' };
  const chipHtml = (s) => `<span class="chipTag" data-s="${s}">${SVG[STAGE_ICON[s] || 'dash']}${STAGE_TEXT[s]}</span>`;

  /** 新插入的步骤：还没跑，也没有产物。 */
  function makeStage(skill) {
    const task = TASKS.find(t => t.skill === skill);
    // 运行指令和失败处理是**这一步**的事，所以存在步骤上，不是全局常量
    return {
      skill, status: 'idle', dur: '—', summary: '', files: [], acts: [],
      instruction: (task || {}).instruction || '按这个技能的要求做完，产物写成一页摘要。',
      fail: '停止后续步骤',
    };
  }

  /* ============================================================ 画布 */
  function renderCanvas() {
    const flow = current();
    $('#canvasTitle').textContent = flow.name;
    // 改名进行中：标题位置换成输入框，一个控件只做一件事
    const renaming = state.renaming && !flow.isTask && !flow.none;
    // 还没有流水线：标题就是栏名，不给一个点不出东西的箭头
    $('#canvasTitlePlain').hidden = !flow.none;
    $('#titleBtn').hidden = Boolean(renaming) || Boolean(flow.none);
    $('#renameInput').hidden = !renaming;

    const badge = $('#canvasState');
    if (flow.isTask) {
      badge.dataset.s = 'idle';
      badge.innerHTML = `<span class="dot" data-s="idle"></span>单任务`;
    } else {
      const pipe = pipelineStatus(flow);
      badge.dataset.s = pipe;
      badge.innerHTML = `<span class="dot" data-s="${pipe}"></span>${PIPE_TEXT[pipe]}`;
    }

    // 单任务没有流水线运行记录，所以这行对它是纯文字（disabled），不是入口
    $('#canvasMeta').disabled = Boolean(flow.isTask) || Boolean(flow.none);
    const runs = runsOf(flow);
    $('#canvasMeta').textContent = flow.none
      ? '新建一条流水线开始'
      : flow.isTask
      ? (flow.updated && flow.updated !== '—'
          ? `单独运行 · 最近一次 ${flow.updated} · 不写入任何流水线`
          : '单独运行 · 不写入任何流水线 · 改完可直接运行')
      : flow.stages.length === 0
        ? '0 个步骤 · 串行执行，失败即停'
        : runs.length
          ? `最近运行 ${runLabel(runs[0])} · ${flow.stages.length} 个步骤 · ${flow.updated} 更新`
          : `${flow.stages.length} 个步骤 · 串行执行，失败即停${flow.state === 'idle' ? '' : ` · ${PIPE_TEXT[pipelineStatus(flow)]}`}`;

    // 顶部横向步骤条（窄面板时替代竖轨道）
    renderStepStrip(flow);

    // 一条流水线都没有：这一步该做的是「造一条」，不是「往里放第一步」
    if (flow.none) {
      $('#flow').innerHTML = `
        <div class="emptyFlow">
          <span class="emptyMark">${SVG.plus}</span>
          <h4>还没有流水线</h4>
          <p>一条流水线把若干张卡片按顺序串起来：前一步的产出自动成为后一步的输入。</p>
          <button class="btn primary" type="button" id="createPipeBtn">${SVG.plus}<span>新建流水线</span></button>
        </div>`;
      renderStepStrip(flow);
      renderRunbar(flow);
      return;
    }
    // 流程
    if (flow.stages.length === 0) {
      $('#flow').innerHTML = `
        <div class="emptyFlow">
          <span class="emptyMark">${SVG.plus}</span>
          <h4>这条流水线还没有步骤</h4>
          <p>步骤按顺序串行执行，前一步的产物是后一步的输入。先挑一个任务当第一步。</p>
          <button class="btn primary" type="button" id="addStepBtn">${SVG.plus}<span>添加第一个步骤</span></button>
        </div>`;
      renderRunbar(flow);
      return;
    }

    const parts = [];
    flow.stages.forEach((st, i) => {
      if (i > 0) {
        parts.push(`<div class="connector"><button class="insertBtn" type="button" data-insert="${i}" aria-label="在第 ${i + 1} 位插入步骤">${SVG.plus}</button></div>`);
      }
      parts.push(nodeHtml(st, i, flow.stages.length));
    });
    parts.push(`<div class="connectorShort"></div>`);
    parts.push(`<button class="addStep" type="button" id="addStepBtn">${SVG.plus} 添加步骤</button>`);
    $('#flow').innerHTML = parts.join('');

    // 运行条
    renderRunbar(flow);

    // 改名框被重渲染冲掉时把焦点放回去：草稿存在 state 里，字不会丢
    if (state.stepRename !== null) focusStepRename();
  }

  function renderStepStrip(flow) {
    const strip = $('#stepStrip');
    strip.hidden = flow.stages.length === 0;
    if (flow.stages.length === 0) { strip.innerHTML = ''; return; }
    strip.innerHTML = flow.stages.map((st, i) => `
      <button class="stepChip" type="button" data-strip="${i}"
              data-s="${st.status}" aria-selected="${i === state.sel}">
        <b>${String(i + 1).padStart(2, '0')}</b>
        <span>${esc(stageName(st))}</span>
        <span class="dot" data-s="${st.status}"></span>
      </button>`).join('');
  }

  function nodeHtml(st, i, total) {
    const selected = i === state.sel;
    const renaming = state.stepRename === i;
    const done = st.status === 'done';
    const failed = st.status === 'failed';
    const running = st.status === 'running';
    const queued = st.status === 'queued';

    let foot;
    if (renaming) {
      foot = `<span>回车保存 · Esc 放弃</span>`;
    } else if (done) {
      // 整块节点都可点，轨道上不再塞「查看」按钮跟产出摘要抢宽度
      // 产物来自哪一次：整链跑就是 #4，单点重跑过就是 #5，逐步骤看得见
      foot = `<span>${esc(st.summary)}</span>${st.run ? `<span class="nodeRun"${st.runScope && st.runScope !== 'full' ? ' data-solo="1"' : ''} title="这一步的产物来自第 ${st.run} 次运行${st.runScope === 'single' ? '，那次只跑了这一步' : ''}">${st.runScope && st.runScope !== 'full' ? `单步 #${st.run}` : `#${st.run}`}</span>` : ''}`;
    } else if (running) {
      foot = `<span class="nodeProg"><i></i></span><span>${esc(st.summary)}</span>`;
    } else if (failed) {
      foot = `${SVG.warn}<span>${esc(st.summary)}</span>`;
    } else if (queued) {
      foot = `<span>等待第 ${i} 步完成</span>`;
    } else if (st.status === 'stopped') {
      // 跑到一半被停下，和「还没启动过」是两件事：它启动了，只是没交出产物
      foot = `<span>这一跑被打断，没有产物</span>`;
    } else {
      foot = `<span>还没启动过</span>`;
    }

    // 每个状态一个记号，和状态标签共用 STAGE_ICON：待运行是方框，排队中是虚线圆
    const stateIcon = SVG[STAGE_ICON[st.status] || 'dash'];

    return `
      <div class="node" role="button" tabindex="0" data-node="${i}" data-s="${st.status}" aria-selected="${selected}">
        <div class="nodeTop">
          <span class="nodeIndex">${String(i + 1).padStart(2, '0')}</span>
          ${renaming
            ? `<input class="nodeTitleEdit" id="stepRenameInput" type="text" value="${escAttr(state.stepRenameDraft ?? stageName(st))}" autocomplete="off" spellcheck="false" aria-label="任务名称">`
            : `<span class="nodeTitle">${esc(stageName(st))}</span>`}
          <span class="nodeState">${stateIcon}${STAGE_TEXT[st.status]}</span>
          <span class="nodeDur" ${running ? 'data-timer="stage"' : ''}>${running ? stageElapsed(st) : esc(st.dur)}</span>
        </div>
        <div class="nodeFoot" data-s="${st.status}">${foot}</div>
      </div>`;
  }

  /**
   * 右上角那一个按钮的状态：整条流水线唯一的运行 / 停止入口。
   *
   * 跑起来就变成「停止」——位置不动、字宽不动（运行 / 停止都是两个字），只有图标由
   * 三角换成方块、填充退回一圈描边。停止中那一下按不下去（正在收尾），没有步骤时也
   * 按不下去（按了什么都不发生）。
   */
  function paintRunButton(flow) {
    const btn = $('#runAllBtn');
    const label = $('#runAllLabel');
    const noSteps = flow.stages.length === 0;
    // 一张卡片的面板（单任务）里，右上角这个按钮就是那张卡片的运行入口，所以它单独跑
    // 也算「在跑」；流水线面板里它只管整条，某一步单独跑归那一步自己的按钮。
    const soloRunning = flow._solo !== undefined && flow.stages[flow._solo]?.status === 'running';
    const running = flow.isTask ? soloRunning : flow.state === 'running';
    const stopping = flow.isTask ? soloRunning && flow._soloStopping === true : flow._stopping === true;
    const scope = runScope(flow);
    btn.dataset.stop = running ? '1' : '0';
    btn.classList.toggle('stop', running);
    btn.classList.toggle('primary', !running);
    btn.disabled = noSteps || stopping;
    // 同一个盒子里四种读法：运行 / 接着跑 / 重跑 / 停止。跑起来之后右半边收起来——
    // 那一次运行只有一个出口，旁边不该再摆一个"要不要再跑一遍"
    // 单卡片面板不在这一轮的范围里：它只有一个"运行这一步"，没有范围可选，字不动
    label.textContent = stopping ? '正在停止' : running ? '停止' : noSteps || flow.isTask ? '运行' : scope.word;
    const title = noSteps
      ? '先加一个步骤'
      : stopping
        ? '正在停下来'
        : running
          ? flow.isTask ? '停止这次运行 · 之前的结果保留' : '停止这次运行 · 已完成的步骤保留'
          : flow.isTask ? '运行这一步' : `${scope.word}：${scope.title}`;
    btn.title = title;
    btn.setAttribute('aria-label', title);
  }

  /**
   * 主按钮这一次要做的事：跑什么、从第几步起。
   *
   * 三种读法全由行状态推出来，不记在 state 里——记着的话，跑完一步它就会跟画布不一致：
   * · 全跑完了 → 重跑（从第 1 步起）。这是唯一还剩下的一件事，所以它就是默认那句；
   * · 有跑过的也有没跑的 → 接着跑（从第一个没完成的步骤起）；
   * · 一次都没跑 → 运行（从第 1 步起）。「接着跑」在这里是句假话，没有可接的东西。
   * @param flow - 当前流水线。
   * @returns 起点、按钮上的字、以及一句说明。
   */
  function runScope(flow) {
    const n = flow.stages.length;
    const finished = flow.stages.filter(s => s.status === 'done').length;
    if (n > 0 && finished === n) return { from: 0, word: '重跑', title: '从第 1 步起重跑整条' };
    const from = resumeFrom(flow);
    return from === 0
      ? { from: 0, word: '运行', title: '从第 1 步起按顺序跑完' }
      : { from, word: '接着跑', title: `从第 ${from + 1} 步起接着跑` };
  }

  /**
   * 范围菜单里那几行，每次打开都由行状态现算。
   *
   * 每行第二句话说的是「这一次会换掉几份产物」。重跑不是无代价的动作，但代价也不是
   * 不可逆的——旧产物在运行记录里，所以那句话下面再补一句。写清楚比弹确认框省事，
   * 也比不写诚实。
   * @param flow - 当前流水线。
   * @returns 菜单行，第一行就是主按钮按下去会做的那件事。
   */
  function runMenuModel(flow) {
    const n = flow.stages.length;
    const done = flow.stages.map(s => s.status === 'done');
    const finished = done.filter(Boolean).length;
    const allDone = finished === n;
    const scope = runScope(flow);
    const sel = Math.min(state.sel, n - 1);
    const coverFrom = at => done.slice(at).filter(Boolean).length;
    // 每一行都是"范围 · 代价"两句话，顺序也一致：先说跑哪几步，再说会换掉几份
    const range = (a, b) => (a === b ? `第 ${a} 步` : `第 ${a}–${b} 步`);
    const cost = count => (count === 0 ? '都还没跑过' : `换新 ${count} 份产物`);
    const rows = [];
    if (allDone) {
      // 全跑完了：菜单里只剩这一件事，它同时也是主按钮按下去会做的事
      rows.push({ kind: 'all', at: 0, title: '从头重跑', note: `第 1–${n} 步 · ${cost(n)}`, badge: '默认' });
      return rows;
    }
    rows.push({
      kind: 'resume',
      at: scope.from,
      title: scope.from === 0 ? '从头跑' : '接着跑',
      note: `${range(scope.from + 1, n)} · ${cost(coverFrom(scope.from))}`,
      badge: '默认',
    });
    // 一份都还没跑过的时候，「从头重跑」和上面那行是同一件事——不摆第二遍
    if (finished > 0) {
      rows.push({ kind: 'all', at: 0, title: '从头重跑', note: `第 1–${n} 步 · 换新 ${finished} 份产物`, badge: '' });
    }
    // 选中的那一步在"要接着跑的那一步"前面：从这儿起重跑才有意义（中间那几步会被重做）。
    // 落在后面时不给这一行——那和「接着跑」是同一件事，重复一遍反而难选。
    if (finished > 0 && sel > 0 && sel < scope.from) {
      rows.push({
        kind: 'from',
        at: sel,
        title: `从第 ${sel + 1} 步起重跑`,
        note: `${range(sel + 1, n)} · 换新 ${coverFrom(sel)} 份产物`,
        badge: '',
      });
    }
    return rows;
  }

  /**
   * 画那个范围菜单，并决定右半边那道缝在不在。
   *
   * 跑起来之后右半边收起来：那一次运行只有一个出口（停止）。没有步骤、或者这是单卡片
   * 面板时同理——没有"整条"可跑，就没有第二个范围可选。
   * @param flow - 当前流水线。
   */
  function renderRunMenu(flow) {
    const menu = $('#runMenu');
    const caret = $('#runScopeBtn');
    const wrap = $('#runSplit');
    const show = !flow.isTask && flow.stages.length > 0 && flow.state !== 'running';
    if (!show) state.runMenu = false;
    caret.hidden = !show;
    wrap.dataset.caret = show ? '1' : '0';
    const open = state.runMenu && show;
    menu.hidden = !open;
    wrap.dataset.open = open ? '1' : '0';
    caret.setAttribute('aria-expanded', String(open));
    if (!open) return;
    menu.innerHTML = runMenuModel(flow).map(row => `
      <button class="runMenuRow" type="button" role="menuitem" data-scope="${row.kind}" data-at="${row.at}">
        <span><b>${row.title}</b>${row.badge ? `<i>${row.badge}</i>` : ''}</span>
        <em>${row.note}</em>
      </button>`).join('')
      + `<div class="stepMenuSep"></div>
         <div class="stepMenuNote">重跑不丢东西：每一次运行的产物都留在运行记录里。</div>`;
  }

  function renderRunbar(flow) {
    const bar = $('#segBar');
    const noise = $('#runNoise');
    paintRunButton(flow);
    renderRunMenu(flow);
    if (flow.isTask) {
      bar.innerHTML = '';
      const solo = flow._solo !== undefined && flow.stages[flow._solo]?.status === 'running';
      noise.innerHTML = solo
        ? `<span>单任务 · 不排队</span><span>·</span><span>已运行</span><span class="timer" data-timer="stage">${stageElapsed(flow.stages[flow._solo])}</span>`
        : '<span>单任务 · 不排队</span>';
      return;
    }
    if (flow.stages.length === 0) {
      bar.innerHTML = '';
      noise.innerHTML = '<span>还没有步骤</span>';
      return;
    }
    // 单步跑过的一步画成空心段：整条跑完才填实，运行条自己就把"没从头跑过"说清楚。
    // 只有整条还没跑过的时候才这么画——跑完过之后再单点重跑一步，那不是"没跑完"
    const soloSeg = flow.state === 'idle';
    bar.innerHTML = flow.stages.map(s => `<i data-s="${soloSeg && s.status === 'done' && s.runScope && s.runScope !== 'full' ? 'solo' : s.status}"></i>`).join('');
    const doneCount = flow.stages.filter(s => s.status === 'done').length;
    const cur = flow.stages.findIndex(s => s.status === 'running');
    const soloIdx = flow._solo;
    const soloRunning = soloIdx !== undefined && flow.stages[soloIdx]?.status === 'running';
    if (flow.state === 'running') {
      // 停下来要一下（子 agent 得收尾），这一下也要说清楚在收什么
      noise.innerHTML = flow._stopping
        ? `<span>正在停止</span><span>·</span><span>第 ${cur + 1} 步收尾中 · 前面 ${doneCount} 步的产物留着</span>`
        : `<span>运行中 · 第 ${cur + 1} 步 / 共 ${flow.stages.length} 步</span><span>·</span><span>已运行</span><span class="timer" data-timer="run">${runElapsed(flow)}</span>`;
    } else if (soloRunning) {
      // 单独跑这一步：整条没有在跑，所以「运行」还是「运行」；停止在这一步自己的按钮上
      const st = flow.stages[soloIdx];
      noise.innerHTML = `<span>第 ${soloIdx + 1} 步单独运行中</span><span>·</span><span>已运行</span><span class="timer" data-timer="stage">${stageElapsed(st)}</span>`;
    } else if (flow.state === 'failed') {
      noise.innerHTML = `<span>${doneCount} / ${flow.stages.length} 步完成 · 第 ${doneCount + 1} 步失败，后续未执行</span>`;
    } else if (flow.state === 'stopped') {
      // 停在第几步、从哪一步接着跑，都要说准：那句起点和引擎共用 resumeFrom，
      // 按钮上的字也一样——它现在叫「接着跑」，句子就该这么叫它
      const at = flow._stoppedAt;
      const from = resumeFrom(flow);
      noise.innerHTML = at === undefined
        ? `<span>${doneCount} / ${flow.stages.length} 步完成 · 已手动停止</span>`
        : `<span>${doneCount} / ${flow.stages.length} 步完成 · 第 ${at + 1} 步停在半路 · 点「${runScope(flow).word}」从第 ${from + 1} 步接着跑</span>`;
    } else if (flow.state === 'done') {
      // 跑完之后又单点重跑过某一两步：整条还是「完成」，但各步的产物已经不是同一次的。
      // 这件事必须说出来——一个「完成」盖住它，等于让人拿新旧两份当一套用
      const nums = flow.stages.map(s => s.run).filter(n => n !== undefined);
      const newest = Math.max(...nums);
      const older = flow.stages.map((s, i) => (s.run !== undefined && s.run !== newest ? i + 1 : 0)).filter(Boolean);
      noise.innerHTML = older.length === 0
        ? `<span>${flow.stages.length} 步全部完成 · 用时 ${flow.total}</span><span>·</span><span>点「重跑」从头再来一遍</span>`
        : `<span>整条跑完过</span><span>·</span><span>第 ${older.join('、')} 步还停在第 ${Math.min(...nums)} 次，其余是第 ${newest} 次</span><span>·</span><span>点「重跑」让整条一致</span>`;
    } else if (!runsOf(flow).length) {
      noise.innerHTML = `<span>未整体运行</span><span>·</span><span>${flow.stages.length} 步都还没启动 · 点右上角「运行」按顺序跑完</span>`;
    } else {
      // 跑过，但只是单独跑过其中几步：整条依然没跑过。
      // 报出是哪几步，并说准按钮会从哪一步起——那句话和引擎共用 resumeFrom。
      const solo = flow.stages.map((s, i) => (s.run && s.runScope !== 'full' ? i + 1 : 0)).filter(Boolean);
      const from = resumeFrom(flow);
      const word = runScope(flow).word;
      const which = solo.length === 1 ? `第 ${solo[0]} 步` : `第 ${solo.join('、')} 步`;
      const allDone = flow.stages.every(s => s.status === 'done');
      const next = allDone
        ? `点「${word}」会从头再跑一遍`
        : from === 0
          ? `点「${word}」从第 1 步开始，跑过的那一步会重跑`
          : `点「${word}」从第 ${from + 1} 步接着跑`;
      noise.innerHTML = `<span>整条还没跑过</span><span>·</span><span>${which}单独跑过</span><span>·</span><span>${next}</span>`;
    }
  }

  /**
   * 检查器标题行那个按钮：这一步「单独运行」的入口，也是它的「停止」。
   *
   * 整条在跑的时候它按不下去——那一次运行整条只有一个停止入口（右上角），
   * 这里再放一个就成了同一件事的两种说法。
   */
  function paintRunOne(flow, i, st) {
    const btn = $('#runOneBtn');
    const label = $('#runOneLabel');
    const solo = flow._solo === i && st.status === 'running';
    // 单卡片面板里停止归右上角那一个（它就是这张卡片的运行入口），这里不再放第二个
    const stop = solo && !flow.isTask;
    const stopping = stop && flow._soloStopping === true;
    const chain = flow.state === 'running';
    // 这一步正在整条里跑：单跑会和那一次运行抢同一步，所以只说明停止在右上角
    const busyInChain = chain && st.status === 'running';
    btn.dataset.stop = stop ? '1' : '0';
    btn.classList.toggle('stop', stop);
    btn.disabled = stopping || busyInChain || (solo && flow.isTask);
    // 跑过的那一步，这个按钮改口叫「重跑这一步」：位置不变、事情不变，但"再跑一遍"
    // 和"先跑一下看看"是两种心情，字要说对
    const word = hasResult(st) ? '重跑这一步' : '单独运行';
    label.textContent = stop ? (stopping ? '正在停止' : '停止') : word;
    const title = stop
      ? stopping ? '正在停下来' : '停止这一步 · 它之前的结果保留'
      : busyInChain
        ? '这一步正在整条里跑 · 停止在右上角'
        : solo ? '这次运行正在跑 · 停止在右上角'
          : chain ? '整条正在运行 · 单独跑它会插进这一次运行里'
            : hasResult(st)
              ? '只重跑这一步 · 其它步的产物不动，这一次重跑会记一条运行'
              : '只跑这一步，不算流水线的一次运行';
    btn.title = title;
    btn.setAttribute('aria-label', title);
  }

  /* ============================================================ 检查器 */
  function renderInspector() {
    const flow = current();

    // 没有步骤可选（还没有流水线，或者流水线是空的）：给一段说明，不假装有内容。
    // 加第一步的按钮只在画布上出现一次——同一屏放两个一样的按钮，看起来像两件事。
    if (flow.stages.length === 0) {
      $('#inspKicker').innerHTML = '<span>这条流水线还没有步骤</span>';
      $('#inspTitle').textContent = '未选择步骤';
      $('#runOneBtn').hidden = true;
      $('#inspMeta').innerHTML = '';
      $('#inspMeta').hidden = true;
      $('#actCount').textContent = '0';
      // 页签不强行切走：空态下三个页签说的是同一句话，切到哪都一样
      $$('.inspTab').forEach(b => {
        const on = b.dataset.itab === state.inspTab;
        b.setAttribute('aria-selected', String(on));
        b.setAttribute('tabindex', on ? '0' : '-1');
      });
      $('#resultPanel').hidden = false;
      $('#activityPanel').hidden = true;
      $('#configPanel').hidden = true;
      $('#resultPanel').innerHTML = `
        <div class="docPad">
          <div class="stateBlock">
            <h6>先加一个步骤</h6>
            <p>每个步骤就是一张卡片。加进来以后，这里显示它的结果、活动与配置。</p>
          </div>
        </div>`;
      $('#inspScroll').scrollTop = 0;
      $('#stepMoreBtn').hidden = true;
      state.stepMenu = false;
      renderStepMenu();
      return;
    }

    const i = Math.min(state.sel, flow.stages.length - 1);
    const st = flow.stages[i];

    // 单任务不挂在流水线上，没有「移除」可做
    $('#stepMoreBtn').hidden = !!flow.isTask;

    $('#inspKicker').innerHTML = flow.isTask
      ? `<span>单独运行 · 不属于任何流水线</span>`
      : `<span>第 <b>${i + 1}</b> 步 / 共 ${flow.stages.length} 步 · ${esc(flow.name)}</span>`;

    $('#inspTitle').textContent = stageName(st);
    $('#runOneBtn').hidden = false;
    paintRunOne(flow, i, st);
    $('#inspMeta').hidden = false;
    $('#inspMeta').innerHTML = `
      <code>${esc(st.skill)}</code><span>·</span><span>${esc(flow.model || 'deepseek-chat')}</span>
      ${chipHtml(st.status)}`;

    $('#actCount').textContent = st.acts.length;

    // 标签：选中状态 + roving tabindex，Tab 键只停一次，方向键换页
    $$('.inspTab').forEach(b => {
      const on = b.dataset.itab === state.inspTab;
      b.setAttribute('aria-selected', String(on));
      b.setAttribute('tabindex', on ? '0' : '-1');
    });
    $('#resultPanel').hidden = state.inspTab !== 'result';
    $('#activityPanel').hidden = state.inspTab !== 'activity';
    $('#configPanel').hidden = state.inspTab !== 'config';

    // 换步骤才回到顶部；同一屏的重复渲染（运行推进、切 tab）保持你正看的位置
    const scroller = $('#inspScroll');
    const scrollKey = `${flow.isTask ? `task:${state.focus.id}` : flow.id}:${i}`;
    const keepScroll = state._scrollFor === scrollKey ? scroller.scrollTop : 0;
    renderResult(st, i, flow);
    renderActivity(st);
    renderConfig(st, i, flow);
    renderStepMenu();
    scroller.scrollTop = keepScroll;
    state._scrollFor = scrollKey;
  }

  /**
   * 当前步骤的菜单：上移 / 下移 / 从这一步起重跑 / 重命名 / 移除。
   *
   * 「从这一步起重跑」放在分隔线之上，和两个移位动作一类——它们都是"改这条链怎么跑"，
   * 而重命名和移除是"改这条链是什么"。删除是破坏性操作，放在检查器里而不是轨道上。
   */
  function renderStepMenu() {
    const menu = $('#stepMenu');
    const btn = $('#stepMoreBtn');
    const flow = current();
    const open = state.stepMenu && !flow.isTask && flow.stages.length > 0;

    menu.hidden = !open;
    btn.setAttribute('aria-expanded', String(!!open));
    if (!open) return;

    const i = Math.min(state.sel, flow.stages.length - 1);
    const last = flow.stages.length - 1;

    menu.innerHTML = `
      <button class="stepMenuRow" type="button" data-step="up" ${i === 0 ? 'disabled' : ''}>
        ${SVG.up}<span>上移一位</span>
      </button>
      <button class="stepMenuRow" type="button" data-step="down" ${i === last ? 'disabled' : ''}>
        ${SVG.down}<span>下移一位</span>
      </button>
      <div class="stepMenuSep"></div>
      <button class="stepMenuRow" type="button" data-step="rerun" ${flow.state === 'running' || flow.stages.slice(0, i).some(s => s.status !== 'done') ? 'disabled' : ''}>
        ${SVG.replay}<span>从这一步起重跑</span>
      </button>
      <button class="stepMenuRow" type="button" data-step="rename">
        ${SVG.edit}<span>重命名这一步</span>
      </button>
      <button class="stepMenuRow" type="button" data-step="remove" data-danger="1">
        ${SVG.trash}<span>${state.confirmStepDel ? '再点一次确认移除' : '从流水线中移除'}</span>
      </button>
      <div class="stepMenuNote">${state.confirmStepDel
        ? `将移除「${esc(stageName(flow.stages[i]))}」，这一步的产物会一起从结果里消失`
        : '移除后这一步的产物会一起从结果里消失'}</div>`;
  }

  /** 这一步有没有可看的结果：目录里有文件，或者区域里有内容。 */
  function hasResult(st) {
    return Boolean(st && (st.doc || (st.files && st.files.length > 0)));
  }

  /* ============================================================ 弹层焦点 */
  /*
   * 四个弹层都是模态，但同一个时刻只能有一个是"当前这个"：阅读器压在运行记录上时，
   * 下面那层要 aria-hidden，不然读屏会看到两个模态叠在一起。焦点也是同一件事——
   * 开的时候记住从哪来，关的时候还回去，Tab 在层里绕圈，不跑到背后的画布上去。
   */
  const OVERLAY_IDS = ['#histWrap', '#zoomWrap', '#reviewWrap', '#pickerWrap'];
  const focusStack = [];

  function rememberFocus() {
    const el = document.activeElement;
    focusStack.push(el && el !== document.body ? el : null);
  }

  function restoreFocus() {
    const el = focusStack.pop();
    if (el && document.contains(el) && el.offsetParent !== null) el.focus();
  }

  function syncModalStack() {
    const stack = [];
    if (state.histOpen) stack.push('#histWrap');
    if (state.zoomOpen) stack.push('#zoomWrap');
    if (state.reviewOpen) stack.push('#reviewWrap');
    if (state.picker) stack.push('#pickerWrap');
    const top = stack[stack.length - 1];
    OVERLAY_IDS.forEach(sel => {
      const el = $(sel);
      if (!el) return;
      const open = stack.includes(sel);
      el.setAttribute('aria-hidden', open && sel !== top ? 'true' : 'false');
      const dlg = el.querySelector('[role="dialog"]');
      if (dlg) dlg.setAttribute('aria-modal', String(open && sel === top));
    });
  }

  /* ============================================================ 审核 */
  /**
   * 打开审核弹框。
   *
   * 弹框针对「当前选中的这一份结果」：单任务也能重生成，所以不区分 isTask。
   * 没有产出的步骤不进来——没有东西可审。
   */
  /**
   * 看一眼结果不满意 → 提要求重做。
   *
   * 只有一个入口：阅读器。这样"读"和"判"永远在同一份内容上——结果区那个「审核」
   * 看着方便，但它和阅读器可能对着不同的步骤（一个对着选中的，一个对着快照那一步），
   * 同一个动作两个目标，迟早点错。
   *
   * at 是流水线上的步骤下标：从快照进来时由 zoomStepIndex() 反查出来。
   */
  function openReview(at, fromSnapshot) {
    const flow = current();
    const i = Math.min(at, flow.stages.length - 1);
    const st = flow.stages[i];
    // 有结果就能审：目录型看文件列表，内联型看区域里那段内容
    if (!st || !hasResult(st)) return;
    state.reviewAt = i;
    state.reviewFromSnapshot = Boolean(fromSnapshot);
    state.reviewOpen = true;
    renderReview();
    $('#reviewArea').focus();
  }

  function renderReview() {
    const wrap = $('#reviewWrap');
    const opening = state.reviewOpen && wrap.hidden;
    const closing = !state.reviewOpen && !wrap.hidden;
    if (opening) rememberFocus();
    wrap.hidden = !state.reviewOpen;
    syncModalStack();
    if (closing) restoreFocus();
    if (!state.reviewOpen) return;

    const flow = current();
    const i = Math.min(state.reviewAt, flow.stages.length - 1);
    const st = flow.stages[i];

    // 审核针对这一步的**全部产出**，不是某一个文件，所以这里不点名文件
    $('#reviewWho').textContent = [
      flow.isTask ? null : `第 ${i + 1} 步`,
      stageName(st),
    ].filter(Boolean).join(' · ');

    // 从快照进来的要说清后果：那条记录不会变，改的是这一步的现在
    const from = $('#reviewFrom');
    from.hidden = !state.reviewFromSnapshot;
    from.textContent = state.reviewFromSnapshot && state.zoomRun
      ? `你正在看的是第 ${state.zoomRun.no} 次运行的快照，它不会变。这次重新生成改的是这一步的现在，会另外产生一次运行。`
      : '';

    // 空要求不允许提交：没有要求的「重新生成」只是重跑一次，那不是审核
    $('#reviewSubmit').disabled = $('#reviewArea').value.trim() === '';
  }

  function closeReview() {
    state.reviewOpen = false;
    renderReview();
  }

  /* ============================================================ 阅读器 */
  /**
   * 把当前这一份结果铺满整块面板再读。
   *
   * 只换面积，不换内容：同一个 fileIdx、同一份 DOC，所以关掉之后结果区停在你在
   * 弹框里翻到的那一份，不会出现「刚才看的东西不见了」。
   * 内联结果（表格、正文）没有清单可翻，整篇铺进去就行。
   */
  function openZoom() {
    const flow = current();
    const i = Math.min(state.sel, flow.stages.length - 1);
    const st = flow.stages[i];
    if (!st || !hasResult(st)) return;

    state.zoomSource = 'live';
    state.zoomRun = null;
    state.zoomAt = i;
    // 内联型没有清单，游标归零，免得串成上一步的第几个文件
    if (!st.dir) state.fileIdx = 0;
    state.zoomOpen = true;
    renderZoom();
    $('#zoomClose').focus();
  }

  /**
   * 读某一次运行留下的快照。
   *
   * 和上面是同一个阅读器：同一个文件块、同一份正文、同一个 Esc。差别只有身份——
   * 他看到的是第 N 次运行的交货，不是磁盘上现在那份，所以标"只读"并且不能重跑。
   */
  function openZoomSnapshot(run, k) {
    state.zoomSource = 'snapshot';
    state.zoomRun = run;
    state.zoomAt = k;
    state.fileIdx = 0;
    state.zoomOpen = true;
    renderZoom();
    $('#zoomClose').focus();
  }

  /**
   * 阅读器里这一步，对应流水线上的哪一步。
   *
   * live 就是自己；快照只有 skill 能对，所以按技能名找——全链运行的快照记的就是那一步。
   * 找不到说明这一步已经从流水线里删掉了（历史照样留着），返回 -1，重生成就没有目标。
   */
  function zoomStepIndex() {
    const flow = current();
    if (state.zoomSource !== 'snapshot' || !state.zoomRun) {
      return Math.min(state.zoomAt, Math.max(0, flow.stages.length - 1));
    }
    const steps = state.zoomRun.steps;
    const at = Math.min(state.zoomAt, steps.length - 1);
    const st = steps[at];
    if (!st) return -1;
    // 先认同一个位置，再退回按技能找。库里不该出现两个同技能步骤（选择器已经挡掉），
    // 但老快照可能是那样存下的，这里不能只按技能匹配就下结论
    if (flow.stages[at] && flow.stages[at].skill === st.skill) return at;
    return flow.stages.findIndex(x => x.skill === st.skill);
  }

  function renderZoom() {
    const wrap = $('#zoomWrap');
    const opening = state.zoomOpen && wrap.hidden;
    const closing = !state.zoomOpen && !wrap.hidden;
    if (opening) rememberFocus();
    wrap.hidden = !state.zoomOpen;
    syncModalStack();
    if (closing) restoreFocus();
    if (!state.zoomOpen) return;

    const flow = current();
    const snap = state.zoomSource === 'snapshot' ? state.zoomRun : null;
    const steps = snap ? snap.steps : flow.stages;
    const i = Math.min(state.zoomAt, steps.length - 1);
    const st = steps[i];
    const files = st.files || [];
    const isDir = Boolean(st.dir);
    if (isDir && state.fileIdx >= files.length) state.fileIdx = 0;

    $('#zoomBack').hidden = !snap;
    $('#zoomHint').textContent = snap ? 'Esc 返回' : 'Esc 关闭';

    // 快照只读，但"不满意就重做"必须成立：先把它映射回流水线上的那一步
    const target = zoomStepIndex();
    const reviewBtn = $('#zoomReview');
    reviewBtn.hidden = target < 0 || !hasResult(flow.stages[target]);
    reviewBtn.title = snap ? '提要求，重新生成这一步（会新产生一次运行）' : '提要求，重新生成这一份';

    $('#zoomTitle').textContent = (!snap && flow.isTask)
      ? stageName(st)
      : `第 ${i + 1} 步 · ${stageName(st)}`;

    // 看到的是哪一份货，标题旁边就得写清楚
    const runTag = snap ? `#${snap.no} ` : (st.run ? `#${st.run} · ` : '');
    $('#zoomMeta').textContent = isDir
      ? `${runTag}${st.dir} · ${files.length} 个文件`
      : `${runTag}这一步没有目录，结果就是区域里那段内容`;

    $('#zoomWarn').hidden = !snap;
    if (snap) {
      const what = isDir ? `${files.length} 个文件` : '那段内容';
      $('#zoomWarn').textContent = `这是第 ${snap.no} 次运行时的${what}，之后磁盘上的改动不会反映在这里。`
        + (target < 0 ? '这一步已经从流水线里移除，所以只能看，不能重生成。' : '');
    } else {
      $('#zoomWarn').textContent = '';
    }

    $('#zoomFiles').innerHTML = isDir
      ? files.map((f, k) => `
          <button class="zFile" type="button" data-zoom-file="${k}" aria-pressed="${k === state.fileIdx}">
            ${SVG.file}<span class="zName">${esc(f.name)}</span><span class="zSize">${esc(f.size)}</span>
          </button>`).join('')
      : '';

    if (st.error) {
      $('#zoomBody').innerHTML = `<div class="hError">${esc(st.error)}</div>`;
    } else {
      const doc = isDir ? (files[state.fileIdx] || files[0] || {}).doc : st.doc;
      $('#zoomBody').innerHTML = doc
        ? `<div class="doc">${DOC[doc]}</div>`
        : '<div class="doc"><p>这一步没有可看的内容。</p></div>';
    }
    $('#zoomBody').scrollTop = 0;
  }

  function closeZoom() {
    state.zoomOpen = false;
    renderZoom();
  }

  /* ============================================================ 运行记录 */
  /**
   * 打开运行记录。
   *
   * 记录的单位是「一次运行」而不是「这一步的结果」：只有把一次运行的全部产物收在
   * 一起，"我看的是哪一次"才有答案。单任务没有流水线运行，这里不进来。
   */
  function openHist() {
    if (current().isTask) return;
    state.histOpen = true;
    state.histAt = null;
    renderHist();
    $('#histClose').focus();
  }

  function closeHist() {
    state.histOpen = false;
    renderHist();
  }

  function backHist() {
    state.histAt = null;
    renderHist();
  }

  /** 这次运行的范围：整链几步，还是只重跑了某一步，还是按审核意见重生成。 */
  function scopeText(run) {
    if (run.scope === 'single') return `只跑了第 ${run.only} 步`;
    if (run.scope === 'refine') return `第 ${run.only} 步 · 按审核意见重生成`;
    // 从第 2 步起的那种重跑也是"整条"的一次运行，但它没碰前面几步——两条记录不能长得一模一样
    if (run.from > 1) return `从第 ${run.from} 步起重跑 · 共 ${run.steps.length} 步`;
    return `${run.steps.length} 步`;
  }

  /** 一步的产物摘要：有目录就说文件数和目录，否则说区域里那行字。 */
  function stepProduct(step) {
    if (step.error) return '没有产物';
    if (step.status === 'queued') return '还没跑';
    if (step.files && step.files.length > 0) return `${step.dir} · ${step.files.length} 个文件`;
    if (step.summary) return step.summary;
    return step.doc ? '区域内容' : '没有产物';
  }

  function histListHtml(list) {
    // 按天分组，和插件里的运行历史同构：今天 / 昨天 / 更早
    const groups = [];
    list.forEach((run, k) => {
      const [day, time] = run.when.split(' ');
      const last = groups[groups.length - 1];
      const row = { run, k, time: time || run.when };
      if (last && last.day === day) last.rows.push(row);
      else groups.push({ day, rows: [row] });
    });

    return groups.map(g => `
      <div class="histDay">${esc(g.day)}</div>
      ${g.rows.map(({ run, k, time }) => `
        <button class="histRow" type="button" data-hist-run="${k}">
          <span class="histNo" title="第 ${run.no} 次运行">#${run.no}</span>
          <span class="histWhen">${esc(time)}</span>
          <span class="histSum">${esc(scopeText(run))} · ${esc(run.steps.map(s => taskName(s.skill)).join(' → '))}</span>
          <span class="histTook">${esc(run.took)}</span>
          <span class="histBadge" data-s="${run.status}">${RUN_TEXT[run.status] || ''}</span>
          ${SVG.chev}
        </button>`).join('')}
    `).join('');
  }

  /**
   * 一次运行的详情 = 那次跑过的步骤清单。
   *
   * 这里不铺正文：正文只有一个地方读，就是阅读器。列表负责"有哪几步、各交了什么东西"，
   * 点一步才进阅读器看那一步的快照——否则同一个正文要在两套界面里各实现一遍。
   */
  function histDetailHtml(run) {
    const flow = current();
    const steps = run.steps.map((step, k) => {
      const canOpen = Boolean(step.error || step.doc || (step.files && step.files.length));
      // 没跑成的那一步在这份快照里没有产物可看，但"现在重跑它"总是有意义的——
      // 否则记录只能告诉你失败了，不能让你处置失败
      const liveIdx = flow.isTask ? -1 : flow.stages.findIndex(s => s.skill === step.skill);
      const retry = !canOpen && step.status === 'failed' && liveIdx >= 0;
      const cells = `
          <span class="hStepNo">${k + 1}</span>
          <span class="hStepName">${esc(taskName(step.skill))}</span>
          <span class="hStepMeta">${esc(stepProduct(step))}</span>
          <span class="hStepTook">${esc(step.dur || '—')}</span>`;
      return `
        <div class="hStep">
          ${canOpen
            ? `<button class="hStepHead" type="button" data-hist-open="${k}" aria-label="打开第 ${k + 1} 步的产物">${cells}${SVG.chev}</button>`
            : `<div class="hStepHead hStepMuted">${cells}</div>`}
          ${retry
            ? `<button class="hStepRetry" type="button" data-hist-retry="${liveIdx}" title="现在重跑这一步">重试</button>`
            : ''}
        </div>`;
    }).join('');

    return `
      <div class="histTop">
        <span class="histTopWhen">${esc(run.when)}</span>
        <span class="histTopMeta">${esc(scopeText(run))} · ${esc(run.took)} · ${RUN_TEXT[run.status] || ''}</span>
        <span class="histReadonly">历史快照 · 只读</span>
      </div>
      ${run.instruction ? `<div class="histAsk">审核要求：${esc(run.instruction)}</div>` : ''}
      ${steps}`;
  }

  function renderHist() {
    const wrap = $('#histWrap');
    const opening = state.histOpen && wrap.hidden;
    const closing = !state.histOpen && !wrap.hidden;
    if (opening) rememberFocus();
    wrap.hidden = !state.histOpen;
    syncModalStack();
    if (closing) restoreFocus();
    if (!state.histOpen) return;

    $('#histBack').hidden = state.histAt === null;
    const list = runsOf(current());

    if (state.histAt === null) {
      $('#histTitle').textContent = '运行记录';
      $('#histMeta').textContent = list.length
        ? `${list.length} 次运行 · 点一行看那一次交了什么`
        : '还没有记录';
      $('#histBody').innerHTML = list.length
        ? histListHtml(list)
        : `<div class="stateBlock" style="padding:20px 16px"><p>这条流水线还没启动。整条运行、或者单独运行其中一步之后，记录会出现在这里。</p></div>`;
      return;
    }

    // 换过流水线 / 列表变了之后，旧的下标可能已经越界，退回列表而不是崩
    if (!list[state.histAt]) { state.histAt = null; renderHist(); return; }
    const run = list[state.histAt];
    $('#histTitle').textContent = run.scope === 'full'
      ? `第 ${run.no} 次运行`
      : `第 ${run.no} 次运行 · ${run.scope === 'single' ? `单跑第 ${run.only} 步` : `第 ${run.only} 步重生成`}`;
    $('#histMeta').textContent = `${run.when} · ${scopeText(run)} · ${run.took} · ${RUN_TEXT[run.status] || ''} · 点一步看那份产物`;
    $('#histBody').innerHTML = histDetailHtml(run);
  }

  /**
   * 提交审核意见并重新生成。
   *
   * 原型里用一次定时器假装跑完；真实实现由运行事件驱动，这里只是让结果可见。
   */
  function submitReview() {
    const text = $('#reviewArea').value.trim();
    if (text === '') return;

    const flow = current();
    const i = Math.min(state.reviewAt, flow.stages.length - 1);
    const st = flow.stages[i];

    state.reviewOpen = false;
    state.sel = i;
    state.fileIdx = 0;
    // 重生成也是一次执行，切到活动让人看着它跑
    state.inspTab = 'activity';
    $('#reviewArea').value = '';

    // 这一步的产物正要被换掉：阅读器里那份已经过时了，先关掉
    state.zoomOpen = false;
    state.zoomSource = 'live';
    state.zoomRun = null;
    renderZoom();
    // 从历史快照提的要求：那条记录不会变，留在这里只会看着旧货，退回流水线
    state.histOpen = false;
    renderHist();

    writeStage(flow, i, {
      review: text,
      status: 'running',
      summary: '按审核意见重新生成…',
      // 活动按时间正序追加，和流水线里预置的那些记录同一方向
      acts: [...(st.acts || []), { t: '刚刚', k: 'think', m: `按审核意见重生成：${text}`, d: '—' }],
    });
    renderAll();

    window.setTimeout(() => {
      const fileCount = (st.files || []).length;
      writeStage(flow, i, {
        status: 'done',
        dur: '重新生成',
        // 重生成的是这一步的全部产出：目录型按文件数说，内联型就一句话
        summary: st.dir ? `${fileCount} 个文件 · 已按审核意见重生成` : '已按审核意见重生成',
        acts: [
          ...(st.acts || []),
          { t: '刚刚', k: 'done', m: `写入结果${st.dir ? ` ${fileCount} 个文件` : ''}`, d: '—' },
        ],
      });

      // 审核重生成改动的是产物，所以它也是一次运行——否则"这份结果怎么来的"又断了
      if (!flow.isTask) {
        const after = current().stages[i];
        const list = runsOf(flow);
        const run = makeRun('refine', list, after, i, { instruction: text, took: '0m22s' });
        list.unshift(run);
        after.run = run.no;
        after.runScope = 'refine';
        flow.updated = '刚刚';
      }

      renderAll();
    }, 2200);
  }

  function moveStage(dir) {
    const flow = current();
    if (flow.isTask) return;
    const p = PIPELINES.find(x => x.id === state.focus.id);
    const i = Math.min(state.sel, p.stages.length - 1);
    const j = i + dir;
    if (j < 0 || j > p.stages.length - 1) return;
    const [moved] = p.stages.splice(i, 1);
    p.stages.splice(j, 0, moved);
    state.sel = j;
    state.stepMenu = false;
    renderAll();
  }

  /** 移除一步是破坏性动作：先问一次，再点一次才真的移除，和删除流水线一个规矩。 */
  function removeStage() {
    const flow = current();
    if (flow.isTask) return;
    const p = PIPELINES.find(x => x.id === state.focus.id);
    const i = Math.min(state.sel, p.stages.length - 1);
    if (i < 0) return;
    if (!state.confirmStepDel) {
      state.confirmStepDel = true;
      renderStepMenu();
      window.setTimeout(() => { if (state.confirmStepDel) { state.confirmStepDel = false; renderStepMenu(); } }, 4000);
      return;
    }
    state.confirmStepDel = false;
    p.stages.splice(i, 1);
    // 移除后选中位置顺延，越界则回退
    state.sel = Math.max(0, Math.min(i, p.stages.length - 1));
    state.fileIdx = 0;
    state.stepMenu = false;
    if (p.stages.length === 0) p.state = 'idle';
    renderAll();
  }

  /**
   * 结果面板里那个「运行这一步」按钮。它只负责「运行」：正在跑的这一步，停止在它
   * 标题行那颗按钮上（同一个位置、同一个按钮），空结果块里不再摆第二个。
   */
  function stepRunBtnHtml(i, label) {
    return `<button class="btn ghost" type="button" data-run-node="${i}" style="margin-top:2px">${SVG.play}<span>${label}</span></button>`;
  }

  function renderResult(st, i, flow) {
    const box = $('#resultPanel');

    if (st.status === 'running') {
      // 停止在哪儿说清楚：这一步自己单独跑 → 标题行那颗；整条在跑 / 单卡片 → 右上角。
      // 一次运行只有一个停止入口，这里不摆第二个按钮。
      const solo = !flow.isTask && flow._solo === i;
      const where = solo
        ? ''
        : flow.isTask
          ? `<p style="color:var(--ink4)">要停下来，用右上角的「停止」。</p>`
          : `<p style="color:var(--ink4)">这是整条流水线的第 ${i + 1} 步。要停下来，用右上角的「停止」。</p>`;
      box.innerHTML = `
        <div class="resultBar">${chipHtml('running')}<div class="spacer"></div></div>
        <div class="docPad">
          <div class="stateBlock">
            <h6>正在生成结果</h6>
            <p>${esc(st.summary)}。写完这里会列出它交出的文件。</p>
            ${where}
          </div>
          <div class="skel" style="margin-top:12px">
            <i style="width:52%"></i><i></i><i style="width:86%"></i><i style="width:70%"></i><i style="width:44%"></i>
          </div>
        </div>`;
      return;
    }

    if (st.status === 'queued') {
      box.innerHTML = `
        <div class="resultBar">${chipHtml('queued')}</div>
        <div class="docPad">
          <div class="stateBlock">
            <h6>这一步还没有运行</h6>
            <p>串行编排会等第 ${i} 步完成后自动开始。也可以现在就单独运行它，跳过前面的步骤。</p>
            ${stepRunBtnHtml(i, '单独运行这一步')}
          </div>
        </div>`;
      return;
    }

    if (st.status === 'failed') {
      box.innerHTML = `
        <div class="resultBar">${chipHtml('failed')}<div class="spacer"></div></div>
        <div class="docPad" data-tone="danger">
          <div class="inlineFail">
            ${SVG.warn}
            <div>
              <b>超时：provider 未在时限内返回</b>
              <em>跑了 3 分 02 秒后中断，后续步骤没有启动，流水线停在这一步。</em>
            </div>
          </div>
        </div>
        <div class="resultBar" style="margin-top:12px">
          ${stepRunBtnHtml(i, '重试这一步')}
        </div>`;
      return;
    }

    if (st.status === 'idle') {
      box.innerHTML = `
        <div class="resultBar">${chipHtml('idle')}</div>
        <div class="docPad">
          <div class="stateBlock">
            <h6>这一步待运行</h6>
            <p>${esc((TASKS.find(t => t.skill === st.skill) || {}).desc || '')}</p>
            <p style="color:var(--ink4)">还没启动过：点「运行这一步」只跑它，按顺序跑整条用右上角的「运行」。</p>
            ${stepRunBtnHtml(i, '运行这一步')}
          </div>
        </div>`;
      return;
    }

    // 完成。这个 tab 只回答一件事：这次交了什么。正文去阅读器读，模板在配置里。
    const files = st.files || [];
    const isDir = Boolean(st.dir);

    const revised = st.review
      ? `<div class="revised"><span>按审核意见重新生成</span><em>“${esc(st.review)}”</em></div>`
      : '';

    /* ── 一、这次的结果：只有清单。点一份，进阅读器读 ── */
    const rowOf = (name, size, k) => `
      <button class="resItem" type="button" data-open="${k}" title="在阅读器里打开">
        ${SVG.file}
        <span class="resItemName">${esc(name)}</span>
        <span class="resItemSize">${esc(size || '')}</span>
        ${SVG.chev}
      </button>`;

    let list;
    if (isDir && files.length) {
      list = files.map((f, k) => rowOf(f.name, f.size, k)).join('');
    } else if (!isDir && st.doc) {
      // 无目录：结果就是那一整块内容，没有清单可列。摘要放进按钮里，
      // 免得标题右边再说一遍同样的话。
      list = `
        <button class="resOpen" type="button" data-open="0">
          ${SVG.file}<span>查看结果</span><em>${esc(st.summary || '区域内容')}</em>${SVG.chev}
        </button>`;
    } else if (isDir) {
      list = `<div class="resEmpty">这个目录里没有可读的 markdown。<em>${esc(st.dir)}</em></div>`;
    } else {
      list = '<div class="resEmpty">跑完了，但没有返回目录，区域里也没有内容。</div>';
    }

    const resultsBlock = `
      <div class="resBlock">
        <div class="resBlockHead">
          <span>这次的结果</span>
          ${isDir ? `<em>${files.length} 个文件</em>` : ''}
        </div>
        ${revised}
        <div class="resList">${list}</div>
      </div>`;

    // 模板不在这儿：它是配置，住在「配置」里。这里只回答"这次交了什么"。
    box.innerHTML = resultsBlock;
  }

  /**
   * 模板预览：只给模板自己的骨架，区域里放占位符。
   *
   * **故意不填本次运行的产物**——填了就变成"结果"，和阅读器重复；而且五万字的文档塞进
   * 650 宽的窄栏根本读不了。要看这次真交了什么，点上面那份清单。
   */
  /**
   * 预览：把模板**渲染**出来，看的是样式，不是文字。
   *
   * 模板里那一段区域换成占位块——模型这次要写什么还不知道；其余部分（版式、字体、颜色）
   * 就是模板本身的样子。放在沙箱 iframe 里渲染：模板自带 <style>，不能让它改到工作台。
   */
  const REGION_PLACEHOLDER = '<div style="margin:10px 0;padding:12px;border:1px dashed rgba(128,131,138,0.5);border-radius:8px;font-family:ui-monospace,monospace;font-size:11px;color:#8a8f98">区域内容 · 运行时由模型生成</div>';

  function tplPreview(st) {
    const text = st.templateText || templateSource(regionOf(st));
    // 模板用的是工作台的 --dsw-* 变量；沙箱 iframe 里拿不到，就把这套值照抄进去，
    // 否则预览渲染出来是一片默认黑字，那就不叫"按模板的样式渲染"了。
    const token = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const palette = `<style>:root{
      --dsw-font-family:${token('--f-sans') || 'system-ui'};
      --dsw-alias-label-primary:${token('--ink')};
      --dsw-alias-label-secondary:${token('--ink2')};
      --dsw-alias-label-tertiary:${token('--ink3')};
      --dsw-alias-bg-layer-2:${token('--hover')};
      --dsw-alias-border-l2:${token('--divider')};
      --dsw-alias-bg-base:${token('--card-bg')};
    }</style>`;
    const rendered = text.replace(
      /<!--\s*template-begin\s*-->[\s\S]*?<!--\s*template-end\s*-->/,
      `<!-- template-begin -->${REGION_PLACEHOLDER}<!-- template-end -->`,
    );
    const doc = rendered.includes('<head>')
      ? rendered.replace('<head>', `<head>${palette}`)
      : palette + rendered;
    return `
      <div class="tplSlot">
        <div class="tplSlotLabel">模板预览 · 不含本次产物</div>
        <div class="tplRender">
          <iframe title="模板预览" sandbox="" srcdoc="${esc(doc).replace(/"/g, '&quot;')}"></iframe>
        </div>
      </div>`;
  }

  const CLOSE_SCRIPT = '</' + 'script>';

  /**
   * 「源码」tab：卡片的 HTML 模板全文，原样显示代码。
   *
   * 模板只写一次，区域标记之间是模型每次执行要替换的那一段——
   * 这里的区域已经填成本次执行的产物，所以它同时说明了「写哪儿」和「这次写了什么」。
   * @param st - 这一步的执行记录。
   * @returns 源码视图的 HTML。
   */
  function sourceView(st) {
    // 「源码」就是一个编辑框：模板在这里写、在这里改，跟预览是同一块地方的两种看法。
    return `<textarea class="docSrc" data-tpl-text spellcheck="false" aria-label="模板源码">${esc(st.templateText || templateSource(regionOf(st)))}</textarea>`;
  }

  /**
   * 区域里放什么，由这一步交出的东西决定。
   *
   * 目录型只给一个指针，剩下的交给模板脚本去列、去读、去渲染；
   * 表格/正文型就是结果本身，模板没有目录可列，原样显示。
   * @param st - 这一步的执行记录。
   * @returns 区域片段的 HTML。
   */
  function regionOf(st) {
    if (st.dir) return `    <div data-dsh-files="${esc(st.dir)}" hidden></div>`;
    return DOC[st.doc] || '<p>（无内容）</p>';
  }

  /**
   * 模板全文。区域的位置在这里插进来。
   *
   * 内嵌的 script 不能用反引号和模板变量（会和外层打架），所以写成字符串拼接；
   * 闭合标签也得拆开写，否则会提前截断这份原型自己的 script 块。
   * @param region - 要放进区域标记之间的 HTML。
   * @returns 模板 HTML 全文。
   */
  function templateSource(region) {
    return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    /* 用工作台自己的变量，跟 DSH Desktop 同一套色 */
    body { margin: 0; font-family: var(--dsw-font-family); font-size: 13px;
           line-height: 20px; color: var(--dsw-alias-label-primary); }
    .head { display: flex; align-items: center; gap: 6px; padding: 13px 16px 9px;
            font-size: 11px; color: var(--dsw-alias-label-tertiary); }
    .head b { font-weight: 400; color: var(--dsw-alias-label-secondary);
              font-family: ui-monospace, Consolas, monospace; }
    .files { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 16px 11px;
             border-bottom: .5px solid var(--dsw-alias-border-l2); }
    .file { display: inline-flex; align-items: center; gap: 6px; max-width: 240px;
            padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer;
            color: var(--dsw-alias-label-secondary); background: transparent;
            border: .5px solid var(--dsw-alias-border-l2); border-radius: 8px; }
    .file[aria-pressed="true"] { background: var(--dsw-alias-bg-layer-2);
                                 color: var(--dsw-alias-label-primary); }
    .file span { min-width: 0; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
    .body { padding: 13px 16px 4px; }
  </style>
</head>
<body>
  <div class="head"><b id="dir"></b><span id="count"></span></div>

  <div id="run-out">
<!-- template-begin -->
${region}
<!-- template-end -->
  </div>

  <div class="files" id="files"></div>
  <div class="body" id="body"></div>

  <script>
    (function () {
      var root = dsh.root;                                  // 文档在 shadow root 里
      var dirEl = root.querySelector('[data-dsh-files]');   // 区域里只有这个指针
      var filesEl = root.querySelector('#files');
      var bodyEl = root.querySelector('#body');

      // 区域里没有指针，说明这次交的是表格/正文：它们自己会显示，模板不插手
      if (!dirEl) { filesEl.remove(); bodyEl.remove(); return; }

      var dir = dirEl.getAttribute('data-dsh-files');
      root.querySelector('#dir').textContent = dir;

      dsh.files.list(dir).then(function (listing) {
        var docs = listing.entries.filter(function (e) {
          return e.type === 'file' && /\\.md$/i.test(e.name);
        });
        root.querySelector('#count').textContent = docs.length + ' 个文件';

        docs.forEach(function (entry) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'file';
          button.setAttribute('data-path', entry.path);

          var name = document.createElement('span');
          name.textContent = entry.name;
          button.appendChild(name);
          button.addEventListener('click', function () { open(entry); });
          filesEl.appendChild(button);
        });

        if (docs.length > 0) open(docs[0]);   // 没有点击时默认打开第一个
      });

      function open(entry) {
        var rows = filesEl.querySelectorAll('.file');
        for (var i = 0; i < rows.length; i++) {
          rows[i].setAttribute('aria-pressed',
            String(rows[i].getAttribute('data-path') === entry.path));
        }
        dsh.files.read(entry.path).then(function (file) {
          var target = document.createElement('div');
          bodyEl.replaceChildren(target);
          return dsh.markdown.render(target, file.text);
        }).catch(function (error) {
          bodyEl.textContent = '打开失败：' + (error && (error.message || error.code) || '未知错误');
        });
      }
    })();
  ${CLOSE_SCRIPT}
</body>
</html>`;
  }

  function renderActivity(st) {
    const box = $('#activityPanel');
    if (!st.acts.length) {
      box.innerHTML = `<div class="stateBlock" style="padding:16px 0"><p>这一步还没有活动记录。</p></div>`;
      return;
    }
    box.innerHTML = `<div class="actList">${st.acts.map(a => {
      const icon = a.k === 'done' ? SVG.check : a.k === 'fail' ? SVG.warn : SVG[a.k] || SVG.file;
      const name = (ACT[a.k] || {}).name || a.k;
      const isArgKind = ['load', 'search', 'write', 'shell'].includes(a.k);
      return `
        <div class="act" data-k="${a.k}">
          <span class="actIcon">${icon}</span>
          <div class="actBody">
            <div class="actTop">
              <span class="actName">${esc(name)}</span>
              ${isArgKind ? `<span class="actArg">${esc(a.m)}</span>` : ''}
              <span class="actT">${esc(a.t)}</span>
            </div>
            ${isArgKind ? '' : `<div class="actMsg">${esc(a.m)}</div>`}
            <div class="actDur">${esc(a.d)}</div>
          </div>
        </div>`;
    }).join('')}</div>`;
  }

  /**
   * 配置分三层：整条流水线共用什么、这一步单独是什么、模板长什么样。
   *
   * 模板是配置不是结果，所以它在这里，不在结果区——结果区只回答"交了什么"。
   */
  function renderConfig(st, i, flow) {
    const box = $('#configPanel');
    // 模板编辑器要改的就是这一步：渲染时记住它，别在别处再猜一次
    state.cfgStage = st;
    const preview = state.resTab === 'preview';
    const model = flow.model || 'deepseek-chat';
    const perm = flow.perm || '工作区内修改';
    const opt = (v, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(v)}</option>`;

    // 单任务不挂在流水线上，没有"整条流水线"这一层
    const shared = flow.isTask ? '' : `
      <div class="cfgBlock">
        <div class="cfgBlockHead"><span>整条流水线</span><em>改一次，每一步都跟着</em></div>
        <div class="ruleRow">
          <span class="ruleLabel">模型</span>
          <span class="ruleValue">
            <select class="ruleSelect" data-cfg="model">
              ${opt('deepseek-chat', model)}${opt('deepseek-reasoner', model)}
            </select>
            <span class="hint">这一步没有单独指定，跟着流水线走</span>
          </span>
        </div>
        <div class="ruleRow">
          <span class="ruleLabel">权限模式</span>
          <span class="ruleValue">
            <select class="ruleSelect" data-cfg="perm">
              ${opt('工作区内修改', perm)}${opt('只读', perm)}${opt('工作区外写入', perm)}
            </select>
            <span class="hint">写入限制在工作目录内</span>
          </span>
        </div>
        <div class="ruleRow">
          <span class="ruleLabel">工作目录</span>
          <span class="ruleValue">
            <button class="rulePath" type="button" data-cfg="workspace" aria-label="选择工作目录">
              <span class="rulePathText mono">${esc(flow.workspace || DEFAULT_WORKSPACE)}</span>
              <span class="rulePathPick">选择目录</span>
            </button>
            <span class="hint">每一步都跑在这个目录里</span>
          </span>
        </div>
      </div>`;

    box.innerHTML = `
      ${shared}
      <div class="cfgBlock">
        <div class="cfgBlockHead">
          <span>${flow.isTask ? '这条任务' : '这一步'}</span>
          <em>${flow.isTask ? esc(stageName(st)) : `第 ${i + 1} 步 · ${esc(stageName(st))}`}</em>
        </div>
        <div class="ruleRow">
          <span class="ruleLabel">技能</span>
          <span class="ruleValue">
            <select class="ruleSelect" data-cfg="skill" aria-label="技能">
              ${TASKS.map(t => `<option value="${esc(t.skill)}"${t.skill === st.skill ? ' selected' : ''}>${esc(t.name)}</option>`).join('')}
            </select>
            <span class="hint">${esc((TASKS.find(t => t.skill === st.skill) || {}).desc || '这条技能没有说明')}</span>
          </span>
        </div>
        <div class="ruleRow">
          <span class="ruleLabel">运行指令</span>
          <span class="ruleValue">
            <textarea class="ruleArea" rows="2" data-cfg="instruction" aria-label="运行指令" spellcheck="false">${esc(st.instruction || '')}</textarea>
            <span class="hint">这句话会跟着这一步一起交给技能</span>
          </span>
        </div>
        <div class="ruleRow">
          <span class="ruleLabel">失败处理</span>
          <span class="ruleValue">
            <select class="ruleSelect" data-cfg="fail" aria-label="失败处理">
              ${['停止后续步骤', '继续后续步骤'].map(v => `<option value="${esc(v)}"${v === (st.fail || '停止后续步骤') ? ' selected' : ''}>${esc(v)}</option>`).join('')}
            </select>
            <span class="hint">${(st.fail || '停止后续步骤') === '停止后续步骤' ? '串行编排，失败即停' : '这一步失败也接着跑后面的'}</span>
          </span>
        </div>
      </div>

      <div class="cfgBlock">
        <div class="cfgBlockHead">
          <span>模板</span>
          <div class="segTiny">
            <button type="button" data-res-tab="preview" aria-pressed="${preview}">预览</button>
            <button type="button" data-res-tab="source" aria-pressed="${!preview}">源码</button>
          </div>
        </div>
        ${preview ? tplPreview(st) : sourceView(st)}
      </div>`;
  }

  /* ============================================================ 标题菜单 */
  function renderMenu() {
    const menu = $('#canvasMenu');
    if (!state.menuOpen) { menu.hidden = true; return; }
    menu.hidden = false;

    const pipeRows = PIPELINES.map(p => {
      const cur = state.focus.kind === 'pipeline' && state.focus.id === p.id;
      // 菜单里每一行报的也是「整条」的状态，和标题旁那一枚同源——
      // 否则同一个流水线在这两处会一个写「待运行」、一个写「单步跑过」
      const pipe = pipelineStatus(p);
      return `
        <button class="menuRow" type="button" data-pipe="${p.id}" aria-current="${cur}">
          <span class="dot" data-s="${pipe}"></span>
          <span class="menuRowMain">
            <span class="menuRowTitle">${esc(p.name)}</span>
            <span class="menuRowSub">${p.stages.length} 个步骤 · ${PIPE_TEXT[pipe]}</span>
          </span>
          <span class="menuRowTail">${esc(p.updated)}</span>
        </button>`;
    }).join('');

    const taskRows = TASKS.map(t => {
      const cur = state.focus.kind === 'task' && state.focus.id === t.skill;
      return `
        <div class="menuRow" role="button" tabindex="0" data-task="${t.skill}" aria-current="${cur}">
          <span class="menuRowMain">
            <span class="menuRowTitle">${esc(t.name)}</span>
            <span class="menuRowSub">${esc(t.skill)}</span>
          </span>
          <button class="menuRun" type="button" data-run-task="${t.skill}" aria-label="单独运行 ${esc(t.name)}">${SVG.play}</button>
        </div>`;
    }).join('');

    // 当前这条流水线自己的操作：改名和删除。删除要二次确认，破坏性操作没有撤销。
    const curPipe = state.focus.kind === 'pipeline'
      ? PIPELINES.find(p => p.id === state.focus.id)
      : null;
    const pipeOps = curPipe ? `
      <div class="menuSect">这条流水线</div>
      <div class="menuRow" role="button" tabindex="0" data-rename-pipe="1">
        <span class="menuRowMain"><span class="menuRowTitle">重命名</span></span>
      </div>
      <div class="menuRow" role="button" tabindex="0" data-del-pipe="1">
        <span class="menuRowMain"><span class="menuRowTitle"${state.confirmDel ? ' style="color:var(--danger)"' : ''}>${state.confirmDel ? '再点一次确认删除' : '删除这条流水线'}</span></span>
      </div>` : '';

    menu.innerHTML = `
      <div class="menuSect">流水线</div>
      ${pipeRows}
      <div class="menuRow" role="button" tabindex="0" data-new-pipe="1">
        <span class="menuRowMain"><span class="menuRowTitle">新建流水线</span></span>
      </div>
      <div class="menuSep"></div>
      <div class="menuSect">单独运行一个任务</div>
      ${taskRows}
      ${pipeOps}`;
  }

  /* ============================================================ 选择器 */
  function renderPicker() {
    const wrap = $('#pickerWrap');
    const opening = Boolean(state.picker) && wrap.hidden;
    const closing = !state.picker && !wrap.hidden;
    if (opening) rememberFocus();
    if (!state.picker) {
      wrap.hidden = true;
      syncModalStack();
      if (closing) restoreFocus();
      return;
    }
    wrap.hidden = false;
    syncModalStack();

    const flow = current();
    const at = state.picker.insertAt;
    const mode = state.picker.mode;
    // 三种来源说三种话：新建流水线不该说「插在第 6 位」
    $('#pickerTitle').textContent = mode === 'new' ? '给新流水线挑第一个步骤'
      : flow.isTask ? '换成另一个任务' : '添加步骤';
    $('#pickerHint').textContent = mode === 'new' ? '这会成为第一步'
      : `插在第 ${at + 1} 位`;

    const q = state.pickerQ;
    const list = q
      ? TASKS.filter(t => t.name.toLowerCase().includes(q) || t.skill.includes(q))
      : TASKS;

    // 已经在流水线里的技能不再可选：同一技能出现两次，运行记录就只能按技能反查步骤
    const used = flow.isTask ? [] : flow.stages.map(s => s.skill);
    $('#pickerList').innerHTML = list.length ? list.map(t => {
      const dup = used.includes(t.skill);
      return `
      <button class="pickerRow" type="button" data-pick="${t.skill}" ${dup ? 'disabled' : ''}>
        <span class="pickerRowMain">
          <span class="pickerRowTitle">${esc(t.name)}</span>
          <span class="pickerRowSub">${esc(t.skill)}</span>
        </span>
        ${dup ? '<span class="pickerUsed">已在流水线里</span>' : SVG.plus}
      </button>`;
    }).join('') : `<div class="pickerEmpty">没有匹配的任务</div>`;
  }

  /* ============================================================ 渲染入口 */
  function renderAll() {
    renderCanvas();
    renderInspector();
  }

  /* ============================================================ 交互 */
  function selectNode(i) {
    const flow = current();
    if (i < 0 || i >= flow.stages.length) return;
    if (i !== state.sel) { state.fileIdx = 0; state.stepMenu = false; state.confirmStepDel = false; }
    state.sel = i;
    renderCanvas();
    renderInspector();
  }

  function selectPipeline(id) {
    state.focus = { kind: 'pipeline', id };
    state.sel = Math.max(0, Math.min(state.sel, current().stages.length - 1));
    state.fileIdx = 0;
    renderAll();
    closeMenu();
  }

  function selectTask(skill) {
    if (!TASKS.some(t => t.skill === skill)) return;
    state.focus = { kind: 'task', id: skill };
    state.sel = 0;
    state.fileIdx = 0;
    renderAll();
    closeMenu();
  }

  function openMenu() { state.menuOpen = true; renderMenu(); }
  function closeMenu() { state.menuOpen = false; renderMenu(); }

  function openPicker(insertAt, mode = 'insert') {
    state.picker = { insertAt, mode };
    state.pickerQ = '';
    $('#pickerInput').value = '';
    renderPicker();
    setTimeout(() => $('#pickerInput').focus(), 30);
  }
  function closePicker() { state.picker = null; renderPicker(); }

  /**
   * 新建一条空流水线并聚焦它，然后让用户挑第一个步骤。
   * 「新建流水线」和「添加步骤」不是同一个动作，之前混成了一个，滑块文案因此对不上。
   */
  let newPipeSeq = 0;
  function newPipeline() {
    newPipeSeq += 1;
    const id = `draft-${newPipeSeq}`;
    PIPELINES.unshift({
      id,
      name: `未命名流水线 ${newPipeSeq}`,
      updated: '刚刚',
      state: 'idle',
      total: null,
      stages: [],
    });
    state.focus = { kind: 'pipeline', id };
    state.sel = 0;
    state.inspTab = 'activity';
    closeMenu();
    renderAll();
    openPicker(0, 'new');
  }

  /** 就地改名：标题变成输入框，回车落定，Esc 放弃。 */
  function startRename() {
    const p = state.focus.kind === 'pipeline' ? PIPELINES.find(x => x.id === state.focus.id) : null;
    if (!p) return;
    state.menuOpen = false;
    state.confirmDel = false;
    state.renaming = true;
    $('#renameInput').value = p.name;
    renderMenu();
    renderCanvas();
    setTimeout(() => { const el = $('#renameInput'); if (el && !el.hidden) { el.focus(); el.select(); } }, 20);
  }

  function commitRename(save) {
    if (!state.renaming) return;
    const el = $('#renameInput');
    const name = el ? el.value.trim() : '';
    state.renaming = false;
    const p = state.focus.kind === 'pipeline' ? PIPELINES.find(x => x.id === state.focus.id) : null;
    if (save && p && name && name !== p.name) { p.name = name; p.updated = '刚刚'; }
    renderAll();
  }

  /** 开始就地改这一条步骤的名字。 */
  function startStepRename() {
    const flow = current();
    if (flow.isTask || flow.stages.length === 0) return;
    const i = Math.min(state.sel, flow.stages.length - 1);
    state.stepRename = i;
    state.stepRenameDraft = stageName(flow.stages[i]);
    state.stepMenu = false;
    state.confirmStepDel = false;
    renderAll();
    focusStepRename(true);
  }

  /**
   * 把改名框里的字存进去。
   * @param {boolean} save 是否保存；Esc 或点外面放弃时传 false
   */
  function commitStepRename(save) {
    if (state.stepRename === null) return;
    const i = state.stepRename;
    const draft = String(state.stepRenameDraft ?? '').trim();
    state.stepRename = null;
    state.stepRenameDraft = null;
    const p = PIPELINES.find(x => x.id === state.focus.id);
    const st = p && p.stages[i];
    if (save && st && draft && draft !== stageName(st)) {
      st.name = draft;
      p.updated = '刚刚';
    }
    renderAll();
  }

  /** 焦点放回改名框；刚打开时全选，重渲染回来时只把光标挪到末尾。 */
  function focusStepRename(fresh) {
    const input = $('#stepRenameInput');
    if (!input) return;
    if (document.activeElement !== input) input.focus();
    if (fresh) input.select();
    else {
      const n = input.value.length;
      input.setSelectionRange(n, n);
    }
  }

  /** 删除是一条破坏性动作：先问一次，再点一次才真的删。 */
  function deleteCurrentPipe() {
    if (state.focus.kind !== 'pipeline') return;
    if (!state.confirmDel) {
      state.confirmDel = true;
      renderMenu();
      window.setTimeout(() => { if (state.confirmDel) { state.confirmDel = false; renderMenu(); } }, 4000);
      return;
    }
    const id = state.focus.id;
    const idx = PIPELINES.findIndex(p => p.id === id);
    if (idx >= 0) PIPELINES.splice(idx, 1);
    delete RUNS_BY_PIPE[id];
    state.confirmDel = false;
    closeMenu();
    const next = PIPELINES[0];
    state.focus = next ? { kind: 'pipeline', id: next.id } : { kind: 'task', id: TASKS[0].skill };
    state.sel = 0;
    renderAll();
  }

  function pickTask(skill) {
    const flow = current();
    const at = state.picker.insertAt;
    if (flow.isTask) {
      state.focus = { kind: 'task', id: skill };
      state.sel = 0;
    } else {
      const p = PIPELINES.find(x => x.id === state.focus.id);
      // 同一个技能在一张流水线里放两次，运行记录就只能按技能反查步骤，必然错位
      if (p.stages.some(s => s.skill === skill)) { closePicker(); return; }
      p.stages.splice(at, 0, makeStage(skill));
      state.sel = at;
      // 一旦放进了步骤，这一屏就不再是「0 步流水线」了
      if (state.scene !== 'steps') { state.scene = 'steps'; syncSceneSeg(); }
    }
    closePicker();
    renderAll();
  }

  /* ---------------------------------------------------------------- 事件 */
  // 主题
  $$('#themeSeg button').forEach(b => b.addEventListener('click', () => {
    setTheme(b.dataset.themeBtn);
  }));
  function setTheme(theme) {
    state.theme = theme;
    document.body.dataset.theme = theme;
    $$('#themeSeg button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.themeBtn === theme)));
  }

  // 面板宽度
  $$('#widthSeg button').forEach(b => b.addEventListener('click', () => {
    state.width = Number(b.dataset.w);
    $('#app').style.setProperty('--panel-w', state.width + 'px');
    $$('#widthSeg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
  // 场景：没有工作流的时候，这一屏长什么样
  function syncSceneSeg() {
    $$('#sceneSeg button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.scene === state.scene)));
  }

  function applyScene(scene) {
    state.scene = scene;
    state.menuOpen = false;
    state.renaming = false;
    state.stepMenu = false;
    state.runMenu = false;
    state.confirmDel = false;
    state.stepRename = null;
    state.stepRenameDraft = null;
    state.confirmStepDel = false;
    state.fileIdx = 0;
    state.inspTab = 'activity';
    if (scene === 'steps') {
      state.focus = { kind: 'pipeline', id: 'req-to-ship' };
      state.sel = 2;
    } else if (scene === 'zero') {
      // 0 步流水线 = 刚建好、还没放步骤。真造一条进列表，加步骤 / 改名 / 删除才都有东西可操作。
      let p = PIPELINES.find(x => x.id === '__zero');
      if (!p) {
        p = { id: '__zero', name: '新流水线', updated: '刚刚', state: 'idle', total: null, stages: [] };
        PIPELINES.unshift(p);
      }
      state.focus = { kind: 'pipeline', id: p.id };
      state.sel = 0;
    } else if (scene === 'idle') {
      // 还没跑过的流水线：三步全「待运行」。这个状态天天见，但没有一处能看它长什么样
      let p = PIPELINES.find(x => x.id === '__idle');
      if (!p) {
        p = {
          id: '__idle', name: '会话续期（待运行）', updated: '还没启动', state: 'idle', total: null,
          stages: ['requirements-scoping', 'design-doc', 'codegen'].map(makeStage),
        };
        PIPELINES.unshift(p);
      }
      state.focus = { kind: 'pipeline', id: p.id };
      state.sel = 0;
    } else if (scene === 'solo') {
      // 只单独跑过一步：整条没跑过，可这一步已经「完成」了。
      // 这是最容易被读成"自相矛盾"的一屏，所以给它一个能直接看到的位置。
      let p = PIPELINES.find(x => x.id === '__solo');
      if (!p) {
        p = {
          id: '__solo', name: '会话续期 · 试跑', updated: '刚刚', state: 'idle', total: null,
          stages: ['requirements-scoping', 'design-doc', 'codegen'].map(makeStage),
        };
        PIPELINES.unshift(p);
        // 只单独跑过中间那一步：前后两步都还没启动——最容易被读成"整条在跑"的位置
        const st = p.stages[1];
        const product = STEP_PRODUCT['design-doc'] || {};
        st.status = 'done';
        st.dur = '0m31s';
        st.dir = product.dir;
        st.files = product.files || [];
        st.summary = product.summary || '已完成';
        // 活动不是空的：单步运行也会留下它自己的三条记录，活动页要能对上
        st.acts = [
          { t: '13:41:02', k: 'think', m: '开始执行这一步。', d: '—' },
          { t: '13:41:20', k: 'load', m: '上一节点输出（只读）', d: '0.1s' },
          { t: '13:41:33', k: 'done', m: `写入结果 ${(product.files || []).length} 个文件`, d: '—' },
        ];
        const run = makeRun('single', [], st, 1);
        runsOf(p).unshift(run);
        st.run = run.no;
        st.runScope = 'single';
      }
      state.focus = { kind: 'pipeline', id: p.id };
      state.sel = 1;
      state.inspTab = 'result';
    } else if (scene === 'done') {
      // 整条跑完了：这时候主按钮叫「重跑」，范围菜单里默认也是从头再来。
      // "跑完之后还能做什么"这一屏以前没有地方能看，而它正是重跑的入口
      let p = PIPELINES.find(x => x.id === '__done');
      if (!p) {
        p = {
          id: '__done', name: '会话续期 · 已交付', updated: '今天 14:07', state: 'done', total: '4m12s',
          stages: ['requirements-scoping', 'design-doc', 'codegen'].map(makeStage),
        };
        PIPELINES.unshift(p);
        p.stages.forEach((st, i) => {
          const product = STEP_PRODUCT[st.skill] || {};
          st.status = 'done';
          st.dur = STEP_DUR[i % STEP_DUR.length];
          st.dir = product.dir;
          st.files = product.files || [];
          st.doc = product.doc;
          st.summary = product.summary || '已完成';
          // 三步同属第 4 次运行：脚注写 #4，运行条一句「全部完成」就对得上
          st.run = 4;
          st.runScope = 'full';
          st.acts = [
            { t: '14:03:10', k: 'think', m: '开始执行这一步。', d: '—' },
            { t: '14:05:41', k: 'done', m: `写入结果 ${(product.files || []).length} 个文件`, d: '—' },
          ];
        });
        runsOf(p).unshift({
          no: 4, when: '今天 14:07', took: '4m12s', status: 'ok',
          scope: 'full', only: 1, from: 1, kept: [],
          steps: p.stages.map(snapshotStep),
        });
      }
      state.focus = { kind: 'pipeline', id: p.id };
      state.sel = 0;
      state.inspTab = 'result';
    }
    renderAll();
    syncSceneSeg();
  }

  $$('#sceneSeg button').forEach(b => b.addEventListener('click', () => { applyScene(b.dataset.scene); }));

  // 画布：节点 / 插入 / 添加 / 展开菜单
  $('#flow').addEventListener('click', (e) => {
    const insert = e.target.closest('[data-insert]');
