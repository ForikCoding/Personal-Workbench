  /** 这条流水线上一次运行叫什么：整链就 #4，只跑一步就是 #5（只跑了第 3 步）。 */
  function runLabel(run) {
    if (!run) return '还没运行过';
    if (run.scope === 'single') return `#${run.no}（只跑了第 ${run.only} 步）`;
    if (run.scope === 'refine') return `#${run.no}（第 ${run.only} 步按审核意见重生成）`;
    return `#${run.no}`;
  }

  function nowLabel() {
    const d = new Date();
    return `今天 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  /**
   * 记一次只动了一步的运行。
   *
   * scope 有三种：full 整链、single 单点重跑、refine 审核后重生成。前两种是"重新跑"，
   * 第三种是"按意见改"——都改了产物，所以都算一次运行，否则这份结果的来路就断了。
   */
  function makeRun(scope, list, st, i, extra) {
    const run = {
      no: list.length ? list[0].no + 1 : 1,
      when: nowLabel(),
      took: '0m31s',
      status: 'ok',
      scope,
      only: i + 1,
      steps: [{
        skill: st.skill, status: 'done', dur: st.dur || '0m31s',
        dir: st.dir, files: st.files, doc: st.doc, summary: st.summary,
      }],
    };
    return extra ? { ...run, ...extra } : run;
  }

  /* ============================================================ 运行引擎 */
  /*
   * 串行推进：一步跑完再跑下一步，失败即停。整条运行对应**一份**运行记录——
   * 点下运行的那一刻就建好，之后每完成一步就把那份快照刷新一次，所以运行记录里
   * 的「运行中」不是一句摆设，是真的在长。
   *
   * 定时器归 runToken 管：再次启动或点了停止，旧定时器看到令牌变了就自行退出，
   * 不会和新的那次运行抢着改同一个步骤的状态。
   */
  let runToken = 0;
  let runTimer = null;
  // 单独运行这一步也有自己的令牌：停了之后，那次定时器落地也不能再写产物
  let soloToken = 0;
  const STEP_DUR = ['12.4s', '31.8s', '1m48s', '26.0s', '19.2s', '41.6s'];
  const STEP_TICK = [700, 1100, 1600, 900, 800, 1200];
  /** 这一次运行、这一步已经跑了多久。读真实起点，不是只增不减的全局计数。 */
  const runElapsed = (flow) => fmt(flow._startedAt
    ? Math.round((Date.now() - flow._startedAt) / 1000)
    : state.tick.run);
  const stageElapsed = (st) => fmt(st && st.startedAt
    ? Math.round((Date.now() - st.startedAt) / 1000)
    : state.tick.stage);

  /** 时长统一成 0m31s 这种写法，和预置数据一致，免得列表里两种格式并排。 */
  const tookOf = (ms) => {
    const s = Math.max(1, Math.round(ms / 1000));
    return `${Math.floor(s / 60)}m${String(s % 60).padStart(2, '0')}s`;
  };

  /** 运行记录里的每一步：只收那一刻的产物，之后不回读磁盘。 */
  function snapshotStep(s) {
    return {
      skill: s.skill, status: s.status, dur: s.dur,
      dir: s.dir, files: s.files, doc: s.doc, summary: s.summary, error: s.error,
    };
  }

  function activeRun(flow) {
    return runsOf(flow).find(r => r.status === 'running') || null;
  }

  /**
   * 整条运行会从哪一步开始：第一个还没完成的步骤；全都完成就从头再跑一遍。
   *
   * 底部运行条那句「点运行会怎样」必须和这里同源。否则它承诺的起点会跟实际差一步——
   * 比如第 2 步单独跑过、第 1 步还没跑，真正的起点是第 1 步，那一步会被重跑。
   */
  function resumeFrom(flow) {
    const firstIdle = flow.stages.findIndex(s => s.status !== 'done');
    return firstIdle < 0 ? 0 : firstIdle;
  }

  /**
   * 跑整条流水线，从第 from 步起，后面的排队。
   *
   * from 不再是「第一个没跑完的步骤」的别名：重跑已经跑过的步骤得让人自己说（范围菜单、
   * 步骤菜单里的「从这一步起重跑」），引擎只管从那儿开始。起点默认仍由 resumeFrom 给，
   * 所以"没选范围就按运行"这件事没变。
   * @param from - 起点下标，0 是第一步。
   */
  function startRunAt(from) {
    const flow = current();
    if (flow.isTask) { flashRun(0); return; }
    if (flow.stages.length === 0) { openPicker(0, 'new'); return; }
    // 正在跑就别再下一次命令：重复点只会把状态推回去重来一次
    if (flow.state === 'running') return;
    if (!(from >= 0 && from < flow.stages.length)) return;
    // 前面还有没跑完的步骤就从中间起跑：跑完这一遍，整条会变成"完成"却缺前半段，
    // 那个状态没有说法。所以不许这么起跑——两个入口也据此禁用这一项
    if (flow.stages.slice(0, from).some(s => s.status !== 'done')) return;
    // 范围已经选了，菜单该关：留着会挡住第一次状态变化
    state.runMenu = false;
    flow.stages.forEach((s, i) => {
      if (i < from) return;
      s.status = i === from ? 'running' : 'queued';
      if (i > from) s.summary = '';
    });
    const head = flow.stages[from];
    head.startedAt = Date.now();
    head.acts = [...(head.acts || []), { t: '刚刚', k: 'think', m: '开始执行这一步。', d: '—' }];

    flow.state = 'running';
    flow.updated = '刚刚';
    flow._startedAt = Date.now();
    // 上一次停下来的痕迹不能留到这一次：不然「正在停止」会粘在新的一次运行上
    flow._stopping = false;
    flow._stoppedAt = undefined;
    // 不抢选中：你在读第 1 步，就继续读第 1 步
    state.inspTab = 'activity';

    const list = runsOf(flow);
    list.unshift({
      no: list.length ? list[0].no + 1 : 1,
      when: nowLabel(),
      took: '00:00',
      status: 'running',
      scope: 'full',
      only: 1,
      // 从第几步起的：第 1 步起就是一次普通的整条运行，后面几步起就是"重跑后半段"，
      // 运行记录里要分开读，否则第 5 次和第 4 次看起来一模一样
      from: from + 1,
      // 这一次没轮到的步骤，产物还是上一次那份：记录里留一份它们的编号，回看时能对上
      kept: flow.stages.slice(0, from).map((s, i) => ({ step: i + 1, run: s.run })),
      steps: flow.stages.map(snapshotStep),
    });

    runToken += 1;
    renderAll();
    tickRun(flow, from, runToken);
  }

  /** 主按钮那一下：从它自己说的那个起点开始跑。 */
  function startRun() {
    startRunAt(runScope(current()).from);
  }

  /** 等这一步"跑完"，落产物、推进下一步。 */
  function tickRun(flow, i, token) {
    const wait = STEP_TICK[i % STEP_TICK.length];
    runTimer = window.setTimeout(() => {
      if (token !== runToken) return;
      // 流水线在这期间被删掉了：别再往一个已经不在列表里的对象上写状态
      if (!PIPELINES.includes(flow)) return;
      const now = flow.stages[i];
      if (!now || now.status !== 'running') return;

      const product = STEP_PRODUCT[now.skill] || {};
      writeStage(flow, i, {
        status: 'done',
        dur: STEP_DUR[i % STEP_DUR.length],
        dir: product.dir,
        files: product.files || [],
        doc: product.doc,
        summary: product.summary || '已完成',
        error: undefined,
        acts: [...(now.acts || []), {
          t: '刚刚',
          k: 'done',
          m: `写入结果${product.dir ? ` ${product.files.length} 个文件` : ''}`,
          d: '—',
        }],
      });

      const run = activeRun(flow);
      if (run) {
        // 这一步的产物现在来自这次运行，画布上的编号跟着换
        flow.stages[i].run = run.no;
        flow.stages[i].runScope = 'full';
        run.steps = flow.stages.map(snapshotStep);
        run.took = tookOf(Date.now() - (flow._startedAt || Date.now()));
      }

      const next = i + 1;
      if (next < flow.stages.length) {
        const ns = flow.stages[next];
        if (ns.status === 'queued') {
          ns.status = 'running';
          ns.startedAt = Date.now();
          ns.acts = [...(ns.acts || []), { t: '刚刚', k: 'think', m: '开始执行这一步。', d: '—' }];
        }
        flow.updated = '刚刚';
        renderAll();
        tickRun(flow, next, token);
        return;
      }

      flow.state = 'done';
      flow.updated = '刚刚';
      flow.total = run ? run.took : '—';
      if (run) {
        run.status = 'ok';
        run.steps = flow.stages.map(snapshotStep);
        run.took = flow.total;
      }
      renderAll();
    }, wait);
  }

  /**
   * 停止整条运行。
   *
   * 停止不是瞬时动作：真正停下来要等正在跑的那一步收尾，所以先进入「正在停止」
   * （按钮按不下去、运行条说明在收什么），半秒后才落状态。这一步先取消令牌，
   * 让已经在路上的那次 tick 落地也推进不了下一步。
   *
   * 落状态时把三档分清楚：跑完的留着「完成」，被打断的是「已停止」（不是「排队中」——
   * 它不会再自己开始了），还没轮到的退回「待运行」。否则停完之后整条看起来像还在排队。
   */
  function stopRun() {
    const flow = current();
    if (flow.isTask || flow.state !== 'running' || flow._stopping) return;
    runToken += 1;
    if (runTimer) { clearTimeout(runTimer); runTimer = null; }
    flow._stopping = true;
    renderAll();
    window.setTimeout(() => {
      if (!PIPELINES.includes(flow)) return;
      flow._stopping = false;
      // 停整条就把它手边的那次单跑也停掉：两个引擎同时写同一步只会留下半截状态
      soloToken += 1;
      flow._solo = undefined;
      flow._soloPrev = undefined;
      flow._soloStopping = false;
      flow.stages.forEach((s, i) => {
        if (s.status === 'running') {
          s.status = 'stopped';
          s.summary = '已停止';
          s.acts = [...(s.acts || []), { t: '刚刚', k: 'stop', m: '运行被打断，这一步没有交出产物。', d: '—' }];
          flow._stoppedAt = i;
        } else if (s.status === 'queued') {
          s.status = 'idle';
          s.summary = '';
        }
      });
      flow.state = 'stopped';
      flow.updated = '刚刚';
      // 停了的那次运行也要有交代，否则记录里会永远停在"运行中"
      const run = activeRun(flow);
      if (run) {
        run.status = 'stopped';
        run.took = tookOf(Date.now() - (flow._startedAt || Date.now()));
        run.steps = flow.stages.map(snapshotStep);
      }
      renderAll();
    }, 500);
  }

  /**
   * 停止「只跑了这一步」的那次运行。
   *
   * 它和整条无关：不碰 flow.state，也不进运行记录（这次运行没有交出去任何东西）。
   * 这一步退回到它原来的样子——之前有产物就还是那个产物，没有就还是「待运行」，
   * 活动里留一行说明，而不是把「正在处理…」挂在那里。
   */
  function stopSolo(i) {
    const flow = current();
    const st = flow.stages[i];
    if (!st || flow._solo !== i || st.status !== 'running' || flow._soloStopping) return;
    soloToken += 1;
    flow._soloStopping = true;
    renderAll();
    window.setTimeout(() => {
      if (!PIPELINES.includes(flow)) return;
      const prev = flow._soloPrev || {};
      flow._soloStopping = false;
      flow._solo = undefined;
      flow._soloPrev = undefined;
      writeStage(flow, i, {
        status: prev.status || 'idle',
        summary: prev.summary || '',
        dur: prev.dur,
        startedAt: prev.startedAt,
        dir: prev.dir,
        files: prev.files,
        doc: prev.doc,
        acts: [
          ...(st.acts || []),
          { t: '刚刚', k: 'stop', m: '这一步的运行被停止，没有交出产物。', d: '—' },
        ],
      });
      renderAll();
    }, 500);
  }

  /**
   * 单独运行这一步。
   *
   * 单跑不是「流水线的第 N 次」，而是一次**只含一步**的运行：它换掉这一步的产物、
   * 给这一步一个新的运行号，但不认领整条链。所以整链跑和单点重跑可以交替，
   * 画布上每一步各自记着它来自哪一次运行——那一刻的画布不对应任何一次完整运行，
   * 也不该假装对应。
   */
  function flashRun(i) {
    const flow = current();
    const st = flow.stages[i];
    if (!st) return;
    // 正在跑还再点一次，只会把状态推回去重来一次
    if (flow._solo === i && st.status === 'running') return;
    // 这一步正被整条跑着：那一次运行管着它，别再起一个单跑跟它抢同一步
    if (flow.state === 'running' && st.status === 'running') return;

    // 记下它原来的样子：停下来的时候要原样还回去，而不是留一个假的「正在处理…」
    flow._soloPrev = {
      status: st.status === 'running' ? 'idle' : st.status,
      summary: st.summary,
      dur: st.dur,
      startedAt: st.startedAt,
      dir: st.dir,
      files: st.files,
      doc: st.doc,
    };
    flow._solo = i;
    flow._soloStopping = false;
    writeStage(flow, i, {
      status: 'running',
      summary: '正在处理…',
      // 起点是现在：不然「已运行」读的是这一步上一次的起点，一按下去就显示几分钟
      startedAt: Date.now(),
      acts: [...(st.acts || []), { t: '刚刚', k: 'think', m: '开始执行这一步。', d: '—' }],
    });
    state.sel = i;
    state.inspTab = 'activity';
    renderAll();

    soloToken += 1;
    const token = soloToken;
    window.setTimeout(() => {
      // 停过就别再落产物：那次运行已经结束了
      if (token !== soloToken) return;
      if (!PIPELINES.includes(flow)) return;
      flow._solo = undefined;
      flow._soloPrev = undefined;
      // 先落产物，再记这次运行：快照要收这次交出去的东西，不是上一次的
      const product = STEP_PRODUCT[st.skill] || {};
      writeStage(flow, i, {
        status: 'done',
        dur: '0m31s',
        dir: product.dir,
        files: product.files || [],
        doc: product.doc,
        summary: product.summary || '已完成',
        err: undefined,
        acts: [
          ...(st.acts || []),
          { t: '刚刚', k: 'load', m: '上一节点输出（只读）', d: '0.1s' },
          { t: '刚刚', k: 'done', m: `写入结果${product.dir ? ` ${product.files.length} 个文件` : ''}`, d: '—' },
        ],
      });

      // 单任务不进运行记录：它不是流水线的一次运行
      if (!flow.isTask) {
        const after = current().stages[i];
        const list = runsOf(flow);
        const run = makeRun('single', list, after, i);
        list.unshift(run);
        after.run = run.no;
        after.runScope = 'single';
        flow.updated = '刚刚';
      }

      renderAll();
    }, 2000);
  }

  // 计时
  // 计时器读的是这一次运行、这一步的真实起点，不是一个只增不减的全局计数——
  // 否则刚点下运行就显示"已运行 03:39"
  setInterval(() => {
    state.tick.run += 1;
    state.tick.stage += 1;
    const flow = current();
    // 同一步的用时可能同时出现在两处（节点上、运行条上），两处要一起走，
    // 否则同一个事实会显示两个数
    $$('[data-timer="run"]').forEach(el => { el.textContent = runElapsed(flow); });
    const running = flow.stages.find(s => s.status === 'running');
    $$('[data-timer="stage"]').forEach(el => { el.textContent = stageElapsed(running); });
  }, 1000);

  /* ============================================================ 深链 */
  const params = new URLSearchParams(location.search);
  if (params.get('theme') === 'dark') setTheme('dark');
  if (params.get('w')) {
    const w = Number(params.get('w'));
    if ([1280, 1000, 844, 760, 424].includes(w)) {
      state.width = w;
      $('#app').style.setProperty('--panel-w', w + 'px');
      $$('#widthSeg button').forEach(x => x.setAttribute('aria-pressed', String(Number(x.dataset.w) === w)));
    }
  }
  if (params.get('tab') && ['result', 'activity', 'config'].includes(params.get('tab'))) {
    state.inspTab = params.get('tab');
  }
  if (params.get('node') !== null) {
    const n = Number(params.get('node'));
    if (Number.isInteger(n)) state.sel = n;
  }

  renderAll();

  // 首屏那条预置成「运行中」的流水线不是死的：用同一套引擎把它跑完，
  // 否则演示里最贵的一个状态（运行中）永远是张静止画
  const boot = PIPELINES.find(p => p.state === 'running' && p.stages.some(s => s.status === 'running'));
  if (boot) {
    boot._startedAt = Date.now();
    runToken += 1;
    tickRun(boot, boot.stages.findIndex(s => s.status === 'running'), runToken);
  }
})();
</script>
</body>
</html>
