<!--
  结果卡片模板：这一步交出的是一个目录，目录里的 markdown 由这里读出来渲染。

  贴到卡片「配置 → 模板 → 源码」。整份文档只有一处要按你的情况改：
  下面那个 data-dsh-files="docs/详细设计" —— 指向这一步真正写出文件的目录。
  它写在区域**外面**，所以每次运行都留着；区域里面每次会被模型的输出整段替换。

  渲染出来的样子：
  · 目录行：docs/详细设计 · 3 个文件
  · 文件条：一行一个文件、带大小，点一个换一份正文
  · 正文：用应用自己的 markdown 渲染，标题/列表/表格/代码块跟对话里一致

  没文件的时候：目录行、文件条、正文都收起来，区域里那段说明照常显示。
  读不到目录的时候：区域照常显示，下面多一行说清为什么没列出文件。

  卡片对模板的硬性限制，违反任何一条就渲染不出来：
  · 不能引用外部资源。img / iframe / link / object / embed / video / audio 会被整棵删掉，
    样式块里只要引用了外部地址，整个 style 块会被丢掉。
  · 区域里的 script 会被剥掉，行为只能写在模板自己的 script 里。
  · 节点要用 dsh.root 找。文档渲染在影子根里，document.querySelector 会静默返回 null。
  · 工作台的结果 tab 点某一行的文件时，那个路径在 dsh.openFile 里；这里优先打开它，
    名字对不上（改了目录、文件删了）就退回第一个文件。
  · 卡片本身不给内边距，留白得模板自己写。
-->
<style>
  .root {
    padding: 14px 16px 18px;
    font-family: var(--dsw-font-family);
    font-size: 13.5px;
    line-height: 21px;
    color: var(--dsw-alias-label-primary);
  }

  /* 目录行：先藏起来，脚本确认有文件才放出来 ——
     否则配置页的预览里会多一枚孤零零的图标（预览里脚本不跑） */
  .head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 9px;
    font-size: 11px;
    color: var(--dsw-alias-label-tertiary);
  }
  .head[hidden] { display: none; }
  .head svg { flex: none; width: 12px; height: 12px; }
  .head .dir {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    color: var(--dsw-alias-label-secondary);
  }
  .head .count { flex: none; margin-left: auto; }

  /* 文件块：横向排，长名省略号 */
  .files {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 0.5px solid var(--dsw-alias-border-l2);
  }
  .files:empty { display: none; margin: 0; padding: 0; border: 0; }

  .file {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 260px;
    min-width: 0;
    padding: 6px 10px;
    font: inherit;
    font-size: 11.5px;
    color: var(--dsw-alias-label-secondary);
    background: transparent;
    border: 0.5px solid var(--dsw-alias-border-l2);
    border-radius: var(--dsw-radius-md);
    cursor: pointer;
  }
  .file svg { flex: none; width: 12px; height: 12px; }
  /* 悬停与选中都用主题里确实定义了的变量：bg-layer-* 是面板色，border-l* 是分隔线色 */
  .file:hover {
    border-color: var(--dsw-alias-border-l3);
    color: var(--dsw-alias-label-primary);
  }
  .file[aria-pressed='true'] {
    background: var(--dsw-alias-bg-layer-2);
    border-color: var(--dsw-alias-border-l3);
    color: var(--dsw-alias-label-primary);
  }
  .file .name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file .size { flex: none; color: var(--dsw-alias-label-tertiary); }

  /* 区域：没有文件时显示它，有文件时收起来 */
  .lead { margin: 0 0 10px; color: var(--dsw-alias-label-secondary); }

  /* 正文容器。里面的排版由 dsh.markdown.render 负责，那一层是它自己的影子根 */
  .body { min-height: 20px; }
  .body .note { margin: 0; color: var(--dsw-alias-label-tertiary); font-size: 12px; }
</style>

<div class="root">
  <!-- 目录写在这里，不写进区域：区域每次都被模型的输出替换 -->
  <div data-dsh-files="docs/详细设计" hidden></div>

  <div id="run-out">
<!-- template-begin -->
<!--
  这次的交待写在这里。目录里有 markdown 时这一块会收起来（目录行、文件条、正文顶上来）；
  目录里没有文件时，这一块原样显示 —— 所以写的是给人看的那段说明，不是文件清单。
  写什么：这次交出了什么、要人看哪儿。不要复述文件里已有的内容。
-->
<p class="lead">这次没有产出文件，这里是它给出的说明。</p>
<!-- template-end -->
  </div>

  <div class="head" hidden>
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.4 5.2a1 1 0 0 1 1-1h2.6l1.2 1.6h5.4a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H3.4a1 1 0 0 1-1-1z" />
    </svg>
    <span class="dir" id="dir"></span>
    <span class="count" id="count"></span>
  </div>

  <div class="files" id="files"></div>
  <div class="body" id="body"></div>
</div>

<script>
  (function () {
    // 配置页的模板预览没有绑定（没有卡片、没有运行），这时脚本什么也不做，
    // 只把模板原样显示出来。用 typeof 判断：未绑定时 dsh 根本不声明，直接读会抛。
    if (typeof dsh === 'undefined' || !dsh || !dsh.files) return;

    var root = dsh.root;
    var pointer = root.querySelector('[data-dsh-files]');
    var runOut = root.querySelector('#run-out');
    var headEl = root.querySelector('.head');
    var filesEl = root.querySelector('#files');
    var bodyEl = root.querySelector('#body');
    var dirName = root.querySelector('#dir');
    var countEl = root.querySelector('#count');

    // 指针被删掉了：不装作有目录，区域自己显示自己
    if (!pointer) {
      headEl.remove();
      filesEl.remove();
      bodyEl.remove();
      return;
    }

    var dir = pointer.getAttribute('data-dsh-files') || '';

    // 文件条与正文都是脚本建出来的，图标也在这儿拼，省得模板里写一堆重复标签
    var FILE_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
      'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M9.2 2.4H4.6a1 1 0 0 0-1 1v9.2a1 1 0 0 0 1 1h6.8a1 1 0 0 0 1-1V5.6z" />' +
      '<path d="M9.2 2.4v3.2h3.2" /></svg>';

    function sizeLabel(bytes) {
      if (typeof bytes !== 'number' || bytes <= 0) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    function reason(error) {
      var code = error && (error.code || '');
      var table = {
        'no-workspace': '这张卡片还没有工作区目录',
        'outside-workspace': '目录在卡片工作区之外',
        'not-found': '目录或文件不存在',
        'not-directory': '这个路径不是目录',
        'not-file': '这个路径不是文件',
        'not-text': '不是可显示的文本文件',
        'too-large': '文件太大，超过 1 MB',
        'invalid-request': '路径不合法',
      };
      return table[code] || (error && error.message) || '未知错误';
    }

    function note(text) {
      var line = document.createElement('p');
      line.className = 'note';
      line.setAttribute('data-state', '');
      line.textContent = text;
      bodyEl.replaceChildren(line);
    }

    // 目录里没有可读的东西：空容器都摘掉，让区域那段说明露出来
    function standDown() {
      if (runOut) runOut.hidden = false;
      headEl.remove();
      filesEl.remove();
      if (bodyEl.querySelector('[data-state]') === null) bodyEl.remove();
    }

    function open(entry) {
      var rows = filesEl.querySelectorAll('.file');
      for (var i = 0; i < rows.length; i++) {
        rows[i].setAttribute('aria-pressed',
          String(rows[i].getAttribute('data-path') === entry.path));
      }

      dsh.files.read(entry.path).then(function (file) {
        var target = document.createElement('div');
        bodyEl.replaceChildren(target);
        return dsh.markdown.render(target, file.text);
      }).catch(function (error) {
        // 一个文件读不到，换一个文件照样能读：说明留在正文里，不把整块清掉
        var line = document.createElement('p');
        line.className = 'note';
        line.setAttribute('data-state', '');
        line.textContent = '打不开 ' + entry.name + '：' + reason(error);
        bodyEl.replaceChildren(line);
      });
    }

    dirName.textContent = dir;

    dsh.files.list(dir).then(function (listing) {
      var docs = listing.entries.filter(function (entry) {
        return entry.type === 'file' && /\.(md|markdown)$/i.test(entry.name);
      });

      if (docs.length === 0) {
        standDown();
        return;
      }

      // 有文件：区域那段是「没文件时」的说明，收起来；目录行这一刻才有话可说
      if (runOut) runOut.hidden = true;
      headEl.hidden = false;
      countEl.textContent = docs.length + ' 个文件';

      docs.forEach(function (entry) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'file';
        button.setAttribute('data-path', entry.path);
        button.setAttribute('aria-pressed', 'false');

        var name = document.createElement('span');
        name.className = 'name';
        name.textContent = entry.name;

        var size = document.createElement('span');
        size.className = 'size';
        size.textContent = sizeLabel(entry.size);

        button.innerHTML = FILE_ICON;
        button.append(name, size);
        button.addEventListener('click', function () { open(entry); });
        filesEl.append(button);
      });

      // 工作台的结果 tab 里点的是某一行的文件：dsh.openFile 就是那个名字，打开它。
      // 找不到这个名字（模板换了目录、文件被删了）就退回第一个，不让读者对着空白。
      var wanted = dsh.openFile;
      var first = docs[0];
      if (wanted) {
        for (var i = 0; i < docs.length; i++) {
          if (docs[i].path === wanted || docs[i].name === wanted) { first = docs[i]; break; }
        }
      }
      open(first);
    }).catch(function (error) {
      // 目录读不到（没配工作区、路径写错…）：说清楚，别让这一步看着像空的
      headEl.remove();
      filesEl.remove();
      note('读不到 ' + dir + '：' + reason(error));
    });
  })();
</script>
