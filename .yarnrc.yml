enableScripts: false
nmHoistingLimits: workspaces
nodeLinker: node-modules

# Use npmmirror for better connectivity in China
npmRegistryServer: https://registry.npmmirror.com

# Fast-moving Desktop dependencies may be consumed on their publication day.
npmMinimalAgeGate: 0

# macOS releases are universal, so the physical node_modules tree must contain
# both Darwin CPU variants before Electron Builder assembles the two slices.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - x64
    - arm64
